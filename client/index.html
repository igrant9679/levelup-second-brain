<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LevelUp - The Second Brain</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0F1A;--s1:#0F1525;--s2:#161D2E;--s3:#1E2740;--s4:#252F4A;--bd1:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.10);--bd3:rgba(255,255,255,.16);--t1:#F8FAFC;--t2:#94A3B8;--t3:#64748B;--t4:#475569;--ac:#3B82F6;--ach:#60A5FA;--acs:rgba(59,130,246,.15);--red:#F87171;--reds:rgba(239,68,68,.15);--warn:#FBBF24;--warns:rgba(245,158,11,.15);--ok:#4ADE80;--oks:rgba(34,197,94,.15);--purp:#C084FC;--purps:rgba(168,85,247,.15);--top:56px;--side:220px;--r:8px;--brd:rgba(255,255,255,.10)}
body.light-mode{--bg:#F1F5F9;--s1:#FFFFFF;--s2:#F8FAFC;--s3:#EEF2F7;--s4:#E2E8F0;--bd1:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.10);--bd3:rgba(0,0,0,.16);--t1:#0F172A;--t2:#475569;--t3:#94A3B8;--t4:#CBD5E1;--brd:rgba(0,0,0,.10)}
body.compact-mode .lr{padding:2px 0!important}
body.compact-mode .cd{padding:8px!important}
body.compact-mode h1{font-size:16px!important}
body.compact-mode .si{padding:4px 8px!important;font-size:11px!important}
/* LOGIN OVERLAY */
#login-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#login-overlay.hidden{display:none}
.login-box{background:var(--s2);border:1px solid var(--bd2);border-radius:16px;padding:36px 32px;width:360px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:4px;text-align:center}
.login-box p{font-size:12px;color:var(--t3);text-align:center;margin-bottom:24px}
.login-user-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.login-user-btn{background:var(--s3);border:2px solid transparent;border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;transition:border-color .15s}
.login-user-btn:hover,.login-user-btn.sel{border-color:var(--ac)}
.login-user-btn .av-lg{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin:0 auto 6px}
.login-user-btn .u-name{font-size:11px;font-weight:600}
.login-user-btn .u-role{font-size:9px;color:var(--t3)}
.login-pin{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.login-pin input{width:44px;height:44px;border-radius:8px;background:var(--s3);border:1px solid var(--bd2);color:var(--t1);font-size:18px;font-weight:700;text-align:center;outline:none}
.login-pin input:focus{border-color:var(--ac)}
.login-err{color:var(--red);font-size:11px;text-align:center;min-height:16px;margin-bottom:8px}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:3px}
.app{display:grid;grid-template-rows:var(--top) 1fr;height:100vh}

/* TOPBAR */
.topbar{background:var(--s1);border-bottom:1px solid var(--bd1);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.logo svg{width:28px;height:28px}
.logo b{font-size:15px;font-weight:700;background:linear-gradient(135deg,#3B82F6,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo small{font-size:10px;color:var(--t3);display:block;line-height:1;margin-top:-2px}
.tb-s{flex:1;max-width:400px;margin:0 auto;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);display:flex;align-items:center;padding:0 10px;height:32px;gap:6px;position:relative}
.tb-s input{flex:1;background:none;border:none;color:var(--t1);font-size:12px;outline:none}
.tb-s input::placeholder{color:var(--t3)}
/* SEARCH DROPDOWN */
#search-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:500;display:none;max-height:380px;overflow-y:auto}
#search-drop.show{display:block}
.sd-sec{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;padding:8px 12px 4px}
.sd-row{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;transition:background .1s}
.sd-row:hover,.sd-row.active{background:var(--s3)}
.sd-icon{font-size:13px;width:20px;text-align:center;flex-shrink:0}
.sd-label{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-meta{font-size:10px;color:var(--t3);white-space:nowrap}
.sd-hint{padding:6px 12px;font-size:10px;color:var(--t3);border-top:1px solid var(--bd1);display:flex;gap:12px}
.sd-hint kbd{background:var(--s3);padding:1px 4px;border-radius:3px;font-size:9px}
.tb-a{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tbtn{width:32px;height:32px;border-radius:var(--r);background:none;border:none;color:var(--t2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.tbtn:hover{background:var(--s3);color:var(--t1)}
.tbtn .bg{position:absolute;top:1px;right:1px;min-width:14px;height:14px;background:var(--ac);color:#fff;font-size:8px;font-weight:700;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.bn{background:var(--ac);color:#fff;border:none;border-radius:var(--r);padding:0 12px;height:32px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
.bn:hover{background:var(--ach)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer}

/* LAYOUT */
.bg{display:grid;grid-template-columns:var(--side) 1fr;min-height:0;height:100%}
.bg.wr{grid-template-columns:var(--side) 1fr 280px}

/* SIDEBAR */
.sb{background:var(--s1);border-right:1px solid var(--bd1);display:flex;flex-direction:column;padding:8px 0;overflow-y:auto;flex-shrink:0}
.si{display:flex;align-items:center;gap:8px;padding:5px 10px;margin:0 8px 1px;border-radius:6px;color:var(--t2);font-size:12px;cursor:pointer;transition:all .12s;user-select:none;position:relative}
.si:hover{background:var(--s3);color:var(--t1)}.si.on{background:var(--acs);color:var(--ach);font-weight:500}
.si.on::before{content:'';position:absolute;left:-8px;top:4px;bottom:4px;width:3px;background:var(--ac);border-radius:0 2px 2px 0}
.si svg{width:15px;height:15px;flex-shrink:0}.si .l{flex:1}.si .c{font-size:9px;font-weight:600;color:var(--t3);background:var(--s3);padding:1px 5px;border-radius:9px}.si.on .c{background:var(--ac);color:#fff}
.sd{height:1px;background:var(--bd1);margin:6px 14px}
.su{margin-top:auto;padding:8px 14px;border-top:1px solid var(--bd1);display:flex;align-items:center;gap:8px;font-size:11px}

/* MAIN */
.mn{padding:16px 24px;overflow-y:auto;min-width:0}.rr{background:var(--s1);border-left:1px solid var(--bd1);padding:14px;overflow-y:auto}
.scr{display:none;height:calc(100vh - var(--top))}.scr.on{display:block}
.scr>.bg{height:100%;min-height:0}

/* SHARED */
.cd{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:12px;margin-bottom:12px}
.cd-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cd-t{font-size:13px;font-weight:500;display:flex;align-items:center;gap:5px}
.cd-a{font-size:10px;color:var(--ac);cursor:pointer}.cd-a:hover{color:var(--ach)}
.pill{display:inline-flex;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:600;white-space:nowrap}
.p-h{background:var(--reds);color:var(--red)}.p-m{background:var(--warns);color:var(--warn)}.p-l{background:var(--oks);color:var(--ok)}
.p-ip{background:rgba(59,130,246,.15);color:#60A5FA}.p-pe{background:var(--warns);color:var(--warn)}.p-ns{background:rgba(148,163,184,.15);color:#CBD5E1}
.p-sc{background:var(--purps);color:var(--purp)}.p-dn{background:var(--oks);color:var(--ok)}
.pb{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;flex:1}.pb .f{height:100%;border-radius:2px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:0 12px;height:30px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .12s;white-space:nowrap}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ach)}
.btn-s{background:var(--s3);color:var(--t1);border:1px solid var(--bd2)}.btn-s:hover{background:var(--s4)}
.btn-d{background:var(--reds);color:var(--red)}.btn-d:hover{opacity:.8}
.chk{width:14px;height:14px;border:1.5px solid var(--bd3);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chk:hover{border-color:var(--ac)}.chk.on{background:var(--ac);border-color:var(--ac)}.chk.on::after{content:'✓';color:#fff;font-size:9px;font-weight:700}
.tabs{display:flex;gap:2px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer}.tab:hover{background:var(--s3);color:var(--t1)}.tab.on{background:var(--acs);color:var(--ach)}
.tab .tc{font-size:9px;background:var(--s3);padding:1px 4px;border-radius:6px;margin-left:3px}.tab.on .tc{background:var(--ac);color:#fff}
.lr{display:flex;align-items:center;gap:7px;padding:6px 4px;border-bottom:1px solid var(--bd1);font-size:11px;cursor:pointer;border-radius:4px;transition:background .1s}
.lr:last-child{border-bottom:none}.lr:hover{background:rgba(255,255,255,.03);color:var(--t1)}
.lr .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .rm{font-size:10px;color:var(--t3);white-space:nowrap}
.lr .acts{display:none;gap:3px}.lr:hover .acts{display:flex}
.add-c{display:flex;align-items:center;gap:4px;padding:5px 0;font-size:11px;color:var(--ac);cursor:pointer}.add-c:hover{color:var(--ach)}
.tog{width:36px;height:18px;border-radius:9px;background:var(--s4);position:relative;cursor:pointer;transition:.15s;flex-shrink:0}
.tog.on{background:var(--ac)}.tog::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}.tog.on::after{transform:translateX(18px)}
.inp{background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:6px 10px;color:var(--t1);font-size:12px;outline:none;width:100%;font-family:inherit}
.inp:focus{border-color:var(--ac)}textarea.inp{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.pg-h{margin-bottom:14px}.pg-h h1{font-size:22px;font-weight:700}.pg-h p{color:var(--t2);font-size:12px;margin-top:2px}
.ph-r{display:flex;align-items:center;justify-content:space-between}
.subnav{display:flex;gap:2px;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:3px;margin-bottom:12px}
.sn{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer}.sn:hover{color:var(--t1)}.sn.on{background:var(--ac);color:#fff}
.sec-h{font-size:14px;font-weight:600;padding:10px 0 6px;border-bottom:2px solid var(--bd2);margin-bottom:10px}
.stat{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:8px;text-align:center}
.stat-n{font-size:20px;font-weight:700;line-height:1}.stat-l{font-size:10px;color:var(--t3);margin-top:2px}

/* DETAIL DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;justify-content:flex-end}
.drawer-overlay.show{display:flex}
.drawer{width:520px;max-width:90vw;background:var(--s1);border-left:1px solid var(--bd2);padding:20px;overflow-y:auto;animation:slideIn .2s ease}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.drawer h2{font-size:18px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.drawer .close{margin-left:auto;width:28px;height:28px;border-radius:6px;background:var(--s3);border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer .close:hover{background:var(--s4);color:var(--t1)}
.drawer .field{margin-bottom:10px}
.drawer .field label{display:block;font-size:11px;font-weight:500;color:var(--t2);margin-bottom:3px}
.drawer .field-row{display:flex;gap:8px;margin-bottom:10px}
.drawer .field-row>*{flex:1}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-ov.show{display:flex}
.modal{background:var(--s2);border:1px solid var(--bd2);border-radius:12px;padding:20px;width:520px;max-width:95vw;max-height:85vh;overflow-y:auto;animation:popIn .2s ease}
/* ===== FULL ADD MODAL ===== */
.fa-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-start;justify-content:center;backdrop-filter:blur(4px);padding:24px 16px;overflow-y:auto}
.fa-modal-ov.show{display:flex}
.fa-modal{background:var(--s1);border:1px solid var(--bd2);border-radius:14px;width:720px;max-width:96vw;display:flex;flex-direction:column;animation:popIn .2s ease;margin:auto}
.fa-hd{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--bd1);position:sticky;top:0;background:var(--s1);z-index:2;border-radius:14px 14px 0 0}
.fa-hd h2{flex:1;font-size:16px;font-weight:700;margin:0}
.fa-body{padding:20px;overflow-y:auto;max-height:calc(85vh - 120px)}
.fa-ft{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--bd1);position:sticky;bottom:0;background:var(--s1);z-index:2;border-radius:0 0 14px 14px;justify-content:flex-end}
.fa-section{margin-bottom:18px}
.fa-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bd1)}
.fa-row{display:grid;gap:10px;margin-bottom:10px}
.fa-row.c2{grid-template-columns:1fr 1fr}
.fa-row.c3{grid-template-columns:1fr 1fr 1fr}
.fa-row.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.fa-field{display:flex;flex-direction:column;gap:4px}
.fa-field label{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
.fa-field .err{font-size:10px;color:var(--red);margin-top:2px;display:none}
.fa-field .err.show{display:block}
.fa-inp{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:var(--t1);font-size:12px;padding:7px 10px;width:100%;box-sizing:border-box;transition:border-color .15s}
.fa-inp:focus{outline:none;border-color:var(--ac)}
.fa-inp.err-border{border-color:var(--red)}
textarea.fa-inp{resize:vertical;min-height:70px;font-family:inherit}
.fa-checkbox-row{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:4px 0;color:var(--t1)}
.fa-checkbox-row input{width:14px;height:14px;accent-color:var(--ac)}
.fa-tag-wrap{display:flex;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 8px;min-height:34px;cursor:text;align-items:center}
.fa-tag{background:var(--ac);color:#fff;border-radius:4px;padding:2px 7px;font-size:10px;display:flex;align-items:center;gap:3px}
.fa-tag-x{cursor:pointer;opacity:.7;font-size:11px}
.fa-tag-input{background:none;border:none;outline:none;color:var(--t1);font-size:12px;min-width:80px;flex:1}
.fa-typeahead{position:relative}
.fa-typeahead-drop{position:absolute;top:100%;left:0;right:0;background:#1e2840;border:1px solid rgba(255,255,255,.12);border-radius:6px;z-index:10;max-height:160px;overflow-y:auto;display:none}
.fa-typeahead-drop.show{display:block}
.fa-typeahead-item{padding:7px 10px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.fa-typeahead-item:hover{background:rgba(59,130,246,.2)}
.fa-linked-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fa-chip{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:2px 8px;font-size:10px;display:flex;align-items:center;gap:4px;color:var(--ac)}
.fa-chip-x{cursor:pointer;opacity:.7}
.fa-subtask-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.fa-subtask-row input[type=text]{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--t1)}
.fa-subtask-row input[type=text]:focus{outline:none;border-color:var(--ac)}
.fa-add-row{font-size:11px;color:var(--ac);cursor:pointer;padding:5px 0;display:flex;align-items:center;gap:4px}
.fa-add-row:hover{opacity:.8}
.fa-milestone-row{display:grid;grid-template-columns:1fr 130px 100px 24px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.fa-scope-row{display:flex;gap:16px;align-items:center;padding:4px 0}
.fa-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px}
.fa-toggle-track{width:34px;height:18px;background:rgba(255,255,255,.15);border-radius:9px;position:relative;transition:background .2s;flex-shrink:0}
.fa-toggle-track.on{background:var(--ac)}
.fa-toggle-thumb{width:14px;height:14px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .2s}
.fa-toggle-track.on .fa-toggle-thumb{left:18px}
.fa-mood-row{display:flex;gap:10px;padding:4px 0}
.fa-mood-btn{font-size:24px;cursor:pointer;padding:4px;border-radius:8px;border:2px solid transparent;transition:border-color .15s}
.fa-mood-btn.sel{border-color:var(--ac);background:rgba(59,130,246,.15)}
.fa-prompt-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px}
.fa-prompt-row label{font-size:11px;color:var(--t2);padding-top:8px;min-width:180px}
.fa-prompt-row textarea{flex:1}
.fa-repeatable{border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:8px 10px;margin-top:4px}
.fa-rep-row{display:grid;gap:6px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.fa-rep-row:last-child{border-bottom:none}
.fa-day-grid{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.fa-day-btn{width:32px;height:28px;border-radius:5px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--t2);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s}
.fa-day-btn.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.fa-spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal h2{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.modal .close{margin-left:auto;width:26px;height:26px;border-radius:6px;background:var(--s3);border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}

/* AI ASSISTANT BUBBLE */
.ai-bubble{position:fixed;bottom:20px;right:20px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.ai-msg{background:rgba(255,255,255,0.97);border:1px solid rgba(59,130,246,.25);border-radius:12px 12px 4px 12px;padding:10px 14px;max-width:340px;font-size:12px;color:#1a2035;pointer-events:auto;animation:aiSlide .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.18);position:relative}
@keyframes aiSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ai-msg .ai-close{position:absolute;top:4px;right:6px;background:none;border:none;color:#666;cursor:pointer;font-size:12px;padding:2px}
.ai-msg .ai-close:hover{color:#111}
.ai-msg .ai-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.ai-msg .ai-type.reminder{color:var(--ac)}.ai-msg .ai-type.warning{color:var(--warn)}.ai-msg .ai-type.encourage{color:var(--ok)}.ai-msg .ai-type.info{color:var(--purp)}.ai-msg .ai-type.news{color:#F97316}
.ai-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6);border:none;color:#fff;font-size:20px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(59,130,246,.4);transition:transform .15s}
.ai-btn:hover{transform:scale(1.08)}
.ai-btn.pulse{animation:aiPulse 2s infinite}
@keyframes aiPulse{0%,100%{box-shadow:0 4px 20px rgba(59,130,246,.4)}50%{box-shadow:0 4px 30px rgba(59,130,246,.7)}}

/* AI CHAT PANEL */
.ai-panel{position:fixed;bottom:80px;right:20px;width:360px;max-height:500px;background:var(--s1);border:1px solid var(--bd2);border-radius:12px;z-index:160;display:none;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.5);overflow:hidden}
.ai-panel.show{display:flex}
.ai-panel-h{padding:12px;border-bottom:1px solid var(--bd1);display:flex;align-items:center;gap:8px}
.ai-panel-h span{font-size:14px;font-weight:600;flex:1}
.ai-panel-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.ai-chat-msg{font-size:12px;padding:8px 10px;border-radius:8px;max-width:85%;line-height:1.4}
.ai-chat-msg.bot{background:var(--s3);align-self:flex-start}.ai-chat-msg.user{background:var(--acs);color:var(--ach);align-self:flex-end}
.ai-panel-foot{padding:8px;border-top:1px solid var(--bd1);display:flex;gap:6px}
.ai-panel-foot input{flex:1}

/* NOTES 4-PANEL */
.notes-body{display:grid;grid-template-columns:160px 200px 1fr 200px;min-height:0;height:100%}
.notes-nav,.notes-list,.notes-editor,.notes-rail{overflow-y:auto;padding:12px 8px}
.notes-nav{background:var(--s1);border-right:1px solid var(--bd1)}
.notes-list{border-right:1px solid var(--bd1)}
.notes-rail{background:var(--s1);border-left:1px solid var(--bd1)}
.nn{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;font-size:11px;color:var(--t2);cursor:pointer;margin-bottom:1px}
.nn:hover{background:var(--s3);color:var(--t1)}.nn.on{background:var(--acs);color:var(--ach)}
.nc{padding:6px;border-radius:6px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.nc:hover{background:var(--s3)}.nc.on{background:var(--acs);border-color:var(--ac)}
.nc-t{font-size:11px;font-weight:500;margin-bottom:2px}
.nc-tg{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:2px}
.nc-tg span{font-size:8px;color:var(--ac);background:var(--acs);padding:1px 4px;border-radius:2px}
.nc-m{font-size:9px;color:var(--t3);display:flex;gap:4px}

/* MCF GRID */
.mcf{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

/* TEAMS */
.team-card{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:14px;margin-bottom:10px}
.member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd1)}
.member-row:last-child{border-bottom:none}
.member-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.member-info{flex:1;min-width:0}.member-name{font-size:13px;font-weight:500}.member-role{font-size:10px;color:var(--t3)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:8px}
.perm-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);padding:4px 8px;background:var(--s3);border-radius:4px}

/* CRED CARD */
.cred{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:14px;margin-bottom:10px}
.cred-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cred-icon{width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cred-title{font-size:13px;font-weight:500}.cred-desc{font-size:10px;color:var(--t3)}
.cred-st{margin-left:auto;font-size:10px;display:flex;align-items:center;gap:3px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}.dot-g{background:var(--ok)}.dot-r{background:var(--red)}.dot-x{background:var(--t3)}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(45,55,72,0.92);color:#f0f4ff;padding:9px 18px;border-radius:10px;font-size:12px;z-index:300;animation:popIn .2s ease;pointer-events:none;border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,0.35)}

/* HABIT HEATMAP */
.hm{display:flex;gap:1px;flex-wrap:wrap}.hm-c{width:7px;height:7px;border-radius:1px;background:var(--s3)}.hm-c.ok{background:var(--ok)}.hm-c.mi{background:var(--s4)}

/* AI MATRIX */
.aim{width:100%;border-collapse:collapse;font-size:11px}
.aim th{text-align:left;padding:5px 6px;font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd2);font-weight:500}
.aim td{padding:6px;border-bottom:1px solid var(--bd1)}

/* IMPORT */
.import-zone{border:2px dashed var(--bd3);border-radius:10px;padding:30px;text-align:center;cursor:pointer;transition:all .2s}
.import-zone:hover{border-color:var(--ac);background:rgba(59,130,246,.05)}
.import-zone.dragover{border-color:var(--ac);background:rgba(59,130,246,.1)}

/* CALENDAR GRID */
.cal-grid{display:grid;grid-template-columns:50px repeat(7,1fr);gap:0}
.cal-hd{padding:6px;text-align:center;font-size:10px;font-weight:500;color:var(--t2);border-bottom:1px solid var(--bd2)}
.cal-tl{font-size:9px;color:var(--t3);text-align:right;padding:3px 6px 0 0}
.cal-c{border:1px solid var(--bd1);min-height:42px;padding:2px}
.cal-c:hover{background:rgba(255,255,255,.02)}
.cal-ev{font-size:9px;padding:2px 3px;border-radius:2px;margin-bottom:1px;border-left:2px solid var(--ac);background:var(--acs);cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-ev.grn{border-color:var(--ok);background:var(--oks)}.cal-ev.rd{border-color:var(--red);background:var(--reds)}.cal-ev.amb{border-color:var(--warn);background:var(--warns)}.cal-ev.prp{border-color:var(--purp);background:var(--purps)}

/* INSIGHT */
.ins{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:12px;margin-bottom:8px}
.ins.obs{border-left:3px solid var(--ac)}.ins.enc{border-left:3px solid var(--ok);background:rgba(34,197,94,.03)}.ins.wrn{border-left:3px solid var(--warn);background:rgba(245,158,11,.03)}
</style>

function save(k){localStorage.setItem('lu_'+k,JSON.stringify(D[k]))}
function saveAll(){['tasks','notes','projects','goals','journal','habits','teams','aiTopics'].forEach(save);localStorage.setItem('lu_creds',JSON.stringify(D.creds));localStorage.setItem('lu_prefs',JSON.stringify(D.prefs))}
function applyPrefs(){
  document.body.classList.toggle('light-mode',D.prefs.darkMode===false);
  document.body.classList.toggle('compact-mode',!!D.prefs.compact);
  document.documentElement.style.setProperty('--ac',D.prefs.accent||'#3B82F6');
  // derive ach/acs from accent
  document.documentElement.style.setProperty('--ach',D.prefs.accent||'#60A5FA');
  document.documentElement.style.setProperty('--acs',(D.prefs.accent||'#3B82F6')+'26');
}
function toggleDarkMode(el){
  el.classList.toggle('on');
  D.prefs.darkMode=el.classList.contains('on');
  localStorage.setItem('lu_prefs',JSON.stringify(D.prefs));
  applyPrefs();
  toast(D.prefs.darkMode?'🌙 Dark mode on':'☀️ Light mode on');
}
function toggleCompact(el){
  el.classList.toggle('on');
  D.prefs.compact=el.classList.contains('on');
  localStorage.setItem('lu_prefs',JSON.stringify(D.prefs));
  applyPrefs();
  toast(D.prefs.compact?'Compact mode on':'Compact mode off');
}
function setAccent(c){
  D.prefs.accent=c;
  localStorage.setItem('lu_prefs',JSON.stringify(D.prefs));
  applyPrefs();
  renderScreen('settings');
  toast('Accent color updated');
}

const SM={home:'s-home',tasks:'s-tasks',notes:'s-notes',mail:'s-mail',calendar:'s-calendar',projects:'s-projects',goals:'s-goals',journal:'s-journal',archive:'s-archive',settings:'s-settings',myday:'s-myday',myweek:'s-myweek',myyear:'s-myyear',process:'s-process',habits:'s-habits',coach:'s-coach',team:'s-team',capture:'s-home'};
let curScreen='home';
function nav(s){
  document.querySelectorAll('.scr').forEach(x=>x.classList.remove('on'));
  document.getElementById(SM[s]||'s-home').classList.add('on');
  curScreen=s;
  initSidebars(s);
  renderScreen(s);
  if(s==='capture')openModal('capture');
}
function initSidebars(a){
  const t=document.getElementById('sb-tpl');
  document.querySelectorAll('[data-sb]').forEach(sb=>{
    sb.innerHTML=t.innerHTML;
    sb.querySelectorAll('.si').forEach(i=>{i.classList.remove('on');if(i.dataset.n===a)i.classList.add('on')});
  });
}
document.addEventListener('click',e=>{const i=e.target.closest('.si[data-n]');if(i)nav(i.dataset.n)});

// ====== UTILITY ======
function pillClass(p){return p==='High'?'p-h':p==='Medium'?'p-m':p==='Low'?'p-l':''}
function statusPill(s){const m={'In Progress':'p-ip',Pending:'p-pe','Not Started':'p-ns',Scheduled:'p-sc',Done:'p-dn',Active:'p-ip'};return m[s]||'p-ns'}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function saveItem(type,id){
  if(type==='task'){const t=D.tasks.find(x=>x.id===id);if(t){
    t.title=$('#dr-title').value;
    t.priority=$('#dr-pri').value;
    t.status=$('#dr-status').value;
    t.startDate=$('#dr-startdate').value;
    t.endDate=$('#dr-due').value;
    t.due=$('#dr-due').value;
    t.startTime=$('#dr-starttime').value;
    t.endTime=$('#dr-endtime').value;
    const pSel=document.getElementById('dr-proj');
    t.projectId=pSel.value?parseInt(pSel.value):null;
    t.project=pSel.value?D.projects.find(p=>p.id===parseInt(pSel.value))?.name||'':'';
    t.context=$('#dr-ctx').value;
    t.recurring=$('#dr-recurring').value;
    t.estimatedMins=parseInt($('#dr-estmins').value)||0;
    t.energy=$('#dr-energy').value;
    const gSel=document.getElementById('dr-goal');
    t.linkedGoalId=gSel.value?parseInt(gSel.value):null;
    t.notes=$('#dr-notes').value;
    const aSel=document.getElementById('dr-assignee');
    t.assignedTo=aSel?aSel.value||null:t.assignedTo;
    save('tasks');
  }}
  if(type==='note'){const n=D.notes.find(x=>x.id===id);if(n){n.title=$('#dr-title').value;n.tags=$('#dr-tags').value.split(',').map(s=>s.trim()).filter(Boolean);n.source=$('#dr-source').value;n.body=$('#dr-body').value;n.updated='Just now';save('notes')}}
  if(type==='project'){const p=D.projects.find(x=>x.id===id);if(p){p.name=$('#dr-title').value;p.color=$('#dr-color').value;p.status=$('#dr-status').value;p.due=$('#dr-due').value;p.pct=parseInt($('#dr-pct').value)||0;p.desc=$('#dr-body').value;save('projects')}}
  if(type==='goal'){const g=D.goals.find(x=>x.id===id);if(g){
    g.title=$('#dr-title').value;
    g.icon=$('#dr-icon').value;
    g.pct=parseInt($('#dr-pct').value)||0;
    g.target=$('#dr-target').value;
    g.category=document.getElementById('dr-category')?.value||'';
    g.startDate=document.getElementById('dr-startdate')?.value||'';
    g.dueDate=document.getElementById('dr-due')?.value||'';
    g.linkedTaskIds=[...document.querySelectorAll('.goal-task-cb:checked')].map(cb=>parseInt(cb.dataset.tid));
    save('goals');
  }}
  if(type==='journal'){const j=D.journal.find(x=>x.id===id);if(j){j.title=$('#dr-title').value;j.date=$('#dr-date').value;j.mood=$('#dr-mood').value;j.body=$('#dr-body').value;save('journal')}}
  closeDrawer();toast('Saved!');renderScreen(curScreen);
}
function deleteItem(type,id){
  if(!confirm('Delete this item?'))return;
  if(type==='task')D.tasks=D.tasks.filter(x=>x.id!==id);
  if(type==='note')D.notes=D.notes.filter(x=>x.id!==id);
  if(type==='project')D.projects=D.projects.filter(x=>x.id!==id);
  if(type==='goal')D.goals=D.goals.filter(x=>x.id!==id);
  if(type==='journal')D.journal=D.journal.filter(x=>x.id!==id);
  save(type==='task'?'tasks':type+'s');
  closeDrawer();toast('Deleted');renderScreen(curScreen);
}
function $$(s){return document.querySelector(s)}
function $(s){return document.getElementById?document.getElementById(s.replace('#','')):document.querySelector(s)}
function addSubtask(taskId){
  const inp=document.getElementById('new-subtask');
  const title=(inp?.value||'').trim();
  if(!title){toast('Enter a subtask title');return;}
  const t=D.tasks.find(x=>x.id===taskId);
  if(!t)return;
  if(!t.subtasks)t.subtasks=[];
  t.subtasks.push({id:Date.now(),title,done:false});
  save('tasks');
  // re-render subtask list in drawer without closing
  const list=document.getElementById('subtask-list');
  if(list){
    const subs=t.subtasks;
    list.innerHTML=subs.map((s,si)=>`<div class="lr" style="padding:3px 0"><div class="chk ${s.done?'on':''}" onclick="toggleSubtask(${taskId},${si})"></div><span class="rt" style="font-size:11px;${s.done?'text-decoration:line-through;color:var(--t3)':''}">${esc(s.title)}</span><span onclick="deleteSubtask(${taskId},${si})" style="cursor:pointer;color:var(--t3);font-size:10px;margin-left:auto">✕</span></div>`).join('');
  }
  inp.value='';
  inp.focus();
  toast('Subtask added');
}
function toggleSubtask(taskId,idx){
  const t=D.tasks.find(x=>x.id===taskId);
  if(!t||!t.subtasks[idx])return;
  t.subtasks[idx].done=!t.subtasks[idx].done;
  save('tasks');
  // Update drawer subtask list if open
  const list=document.getElementById('subtask-list');
  if(list){const subs=t.subtasks;list.innerHTML=subs.map((s,si)=>`<div class="lr" style="padding:3px 0"><div class="chk ${s.done?'on':''}" onclick="toggleSubtask(${taskId},${si})"></div><span class="rt" style="font-size:11px;${s.done?'text-decoration:line-through;color:var(--t3)':''}">${esc(s.title)}</span><span onclick="deleteSubtask(${taskId},${si})" style="cursor:pointer;color:var(--t3);font-size:10px;margin-left:auto">✕</span></div>`).join('');}
  // Update exec list if on My Day
  const execList=document.getElementById('md-exec-list');
  if(execList){const activeTab=document.querySelector('#md-e .tab.on');const filter=activeTab?activeTab.textContent.toLowerCase().replace(' priority','').replace(' ',''):'all';execList.innerHTML=renderMdExecList(filter==='highpriority'?'high':filter);}
}
function deleteSubtask(taskId,idx){
  const t=D.tasks.find(x=>x.id===taskId);
  if(!t||!t.subtasks)return;
  t.subtasks.splice(idx,1);
  save('tasks');
  const list=document.getElementById('subtask-list');
  if(list){
    const subs=t.subtasks;
    list.innerHTML=subs.map((s,si)=>`<div class="lr" style="padding:3px 0"><div class="chk ${s.done?'on':''}" onclick="toggleSubtask(${taskId},${si})"></div><span class="rt" style="font-size:11px;${s.done?'text-decoration:line-through;color:var(--t3)':''}">${esc(s.title)}</span><span onclick="deleteSubtask(${taskId},${si})" style="cursor:pointer;color:var(--t3);font-size:10px;margin-left:auto">✕</span></div>`).join('');
  }
}

const CAP_TYPES=['Task','Note','Project','Goal','Journal'];
let capType='Task';
function openModal(type,preType){
  const m=$('modal-content');
  capType=preType||'Task';
  if(type==='capture'){
    m.innerHTML=renderCaptureModal(capType);
  }
  $('modal-capture').classList.add('show');
  const ti=document.getElementById('cap-title');if(ti)setTimeout(()=>ti.focus(),80);
}
function renderCaptureModal(active){
  const tabs=CAP_TYPES.map(t=>`<div class="tab ${t===active?'on':''}" onclick="capType='${t}';document.getElementById('modal-content').innerHTML=renderCaptureModal('${t}')" style="flex:1;text-align:center;padding:5px;font-size:11px">${t}</div>`).join('');
  const tabBar=`<div style="display:flex;gap:2px;background:var(--s3);border-radius:6px;padding:2px;margin-bottom:12px">${tabs}</div>`;
  const footer=`<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="doCapture()">Save ${active}</button></div>`;
  const titleField=`<div class="field"><label>Title</label><input class="inp" placeholder="${active==='Task'?'What needs to be done?':active==='Note'?'Note title...':active==='Project'?'Project name...':active==='Goal'?'Goal title...':'Journal entry title...'}" id="cap-title"></div>`;
  if(active==='Task'){
    return `<h2>⚡ Quick Capture <button class="close" onclick="closeModal()">✕</button></h2>${tabBar}${titleField}
    <div class="field"><label>Notes</label><textarea class="inp" placeholder="Add details..." id="cap-body"></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div class="field"><label>Priority</label><select class="inp" id="cap-pri"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
    <div class="field"><label>Due Date</label><input class="inp" type="date" id="cap-due"></div>
    <div class="field"><label>Project</label><select class="inp" id="cap-proj"><option value="">None</option>${D.projects.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Context</label><input class="inp" placeholder="Work, Personal..." id="cap-ctx" value="Inbox"></div></div>${footer}`;

function closeModal(){$('modal-capture').classList.remove('show')}
function doCapture(){
  const title=document.getElementById('cap-title')?.value.trim();if(!title){toast('Title is required');return}
  const now=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(capType==='Task'){
    const due=document.getElementById('cap-due')?.value;const dueLabel=due?new Date(due+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
    D.tasks.push({id:nextId(D.tasks),title,priority:document.getElementById('cap-pri')?.value||'Medium',due:dueLabel||'No date',context:document.getElementById('cap-ctx')?.value||'Inbox',project:document.getElementById('cap-proj')?.value||'',status:'Not Started',myDay:false,energy:'',notes:document.getElementById('cap-body')?.value||''});
    save('tasks');
  } else if(capType==='Note'){
    const tags=(document.getElementById('cap-tags')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
    D.notes.push({id:nextId(D.notes),title,tags,source:document.getElementById('cap-source')?.value||'Quick Capture',updated:'Just now',starred:false,body:document.getElementById('cap-body')?.value||''});
    save('notes');

    const due=document.getElementById('cap-due')?.value;const dueLabel=due?new Date(due+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
    D.projects.push({id:nextId(D.projects),name:title,color:document.getElementById('cap-color')?.value||'#3B82F6',status:document.getElementById('cap-status')?.value||'Active',due:dueLabel||'TBD',pct:0,desc:document.getElementById('cap-body')?.value||''});
    save('projects');
  } else if(capType==='Goal'){
    D.goals.push({id:nextId(D.goals),icon:document.getElementById('cap-icon')?.value||'🎯',title,target:document.getElementById('cap-target')?.value||'',pct:0});
    save('goals');

function setBadge(id,val){
  // Update all instances of this badge across all cloned sidebars
  document.querySelectorAll('#'+id).forEach(el=>{
    if(val&&val>0){el.textContent=val>99?'99+':val;el.style.display='';}
    else{el.textContent='';el.style.display='none';}
  });
}
function updateSidebarBadges(){
  const today=new Date().toISOString().split('T')[0];
  // My Day: tasks in My Day not done
  const myDayCount=D.tasks.filter(t=>t.myDay&&t.status!=='Done').length;
  setBadge('badge-myday',myDayCount);
  // Tasks: overdue tasks (not done, due < today)
  const overdueCount=D.tasks.filter(t=>t.status!=='Done'&&t.due&&t.due<today).length;
  setBadge('badge-tasks',overdueCount);
  // Notes: starred notes
  const starredNotes=D.notes.filter(n=>n.starred).length;
  setBadge('badge-notes',starredNotes);
  // Process: inbox tasks (Not Started, no project)
  const inboxCount=D.tasks.filter(t=>t.status==='Not Started'&&!t.projectId).length;
  setBadge('badge-process',inboxCount);
  // Habits: habits not done today
  const habitsPending=D.habits.filter(h=>!h.doneToday).length;
  setBadge('badge-habits',habitsPending);
  // Coach: sum of overdue + habits pending (actionable items)
  const coachCount=overdueCount+habitsPending;
  setBadge('badge-coach',coachCount>0?coachCount:null);
  // Update notification badge
  const notifCount=buildNotifs().length;
  const nb=document.getElementById('notif-badge');
  if(nb)nb.textContent=notifCount||'';
}

let _bulkSelected=new Set();
let _bulkMode=false;
function toggleBulkMode(){
  _bulkMode=!_bulkMode;
  _bulkSelected.clear();
  renderTaskList();
  const bar=$('bulk-action-bar');
  if(bar)bar.style.display=_bulkMode?'flex':'none';
}
function toggleBulkSelect(id,ev){
  ev.stopPropagation();
  if(_bulkSelected.has(id))_bulkSelected.delete(id);
  else _bulkSelected.add(id);
  const bar=$('bulk-action-bar');
  if(bar){const n=_bulkSelected.size;bar.querySelector('#bulk-count').textContent=n+' selected';}
  const row=document.querySelector(`[data-task-id="${id}"]`);
  if(row)row.style.background=_bulkSelected.has(id)?'var(--acs)':'';
}
function bulkAction(action){
  if(!_bulkSelected.size){toast('No tasks selected');return;}
  const ids=[..._bulkSelected];
  if(action==='done'){
    if(!confirm(`Mark ${ids.length} task(s) as Done?`))return;
    ids.forEach(id=>{const t=D.tasks.find(x=>x.id===id);if(t){t.status='Done';maybeSpawnRecurring(t);}});
    save('tasks');toast(`✓ ${ids.length} task(s) marked Done`);
  } else if(action==='delete'){
    if(!confirm(`Delete ${ids.length} task(s)? This cannot be undone.`))return;
    D.tasks=D.tasks.filter(t=>!ids.includes(t.id));
    save('tasks');toast(`🗑 ${ids.length} task(s) deleted`);
  } else if(action==='project'){
    const pName=prompt('Move to project (enter project name):');
    if(!pName)return;
    const p=D.projects.find(x=>x.name.toLowerCase()===pName.toLowerCase());
    if(!p){toast('Project not found');return;}
    ids.forEach(id=>{const t=D.tasks.find(x=>x.id===id);if(t){t.projectId=p.id;t.project=p.name;}});
    save('tasks');toast(`📁 ${ids.length} task(s) moved to ${p.name}`);
  } else if(action==='someday'){
    ids.forEach(id=>{const t=D.tasks.find(x=>x.id===id);if(t)t.status='Someday';});
    save('tasks');toast(`💤 ${ids.length} task(s) moved to Someday`);
  }
  _bulkSelected.clear();
  updateSidebarBadges();
  renderTaskList();
}
function taskRow(t,showActs=true){
  const isSomeday=t.status==='Someday';
  const assigneeLabel=t.assignedTo?`👤 ${t.assignedTo.split(' ')[0]}`:'Delegate';
  const bulkChk=_bulkMode?`<div class="chk ${_bulkSelected.has(t.id)?'on':''}" style="flex-shrink:0;margin-right:2px" onclick="toggleBulkSelect(${t.id},event)"></div>`:
    `<div class="chk ${t.status==='Done'?'on':''}" onclick="event.stopPropagation();toggleTask(${t.id})"></div>`;
  return `<div class="lr" data-task-id="${t.id}" style="${_bulkSelected.has(t.id)?'background:var(--acs)':''}" onclick="${_bulkMode?`toggleBulkSelect(${t.id},event)`:`openDrawer('task',D.tasks.find(x=>x.id===${t.id}))`}">${bulkChk}<span class="rt">${esc(t.title)}</span><span class="pill ${pillClass(t.priority)}">${t.priority}</span><span class="rm">${esc(t.due)}</span>${t.assignedTo?`<span style="font-size:9px;color:var(--t3);white-space:nowrap">${esc(t.assignedTo.split(' ')[0])}</span>`:''}${showActs?`<span class="acts"><button class="btn btn-s" style="height:20px;font-size:9px;padding:0 5px" title="Delegate task" onclick="event.stopPropagation();delegateTask(${t.id})">📤</button><button class="btn btn-s" style="height:20px;font-size:9px;padding:0 5px" title="Snooze to tomorrow" onclick="event.stopPropagation();snoozeTask(${t.id})">⏰</button><button class="btn btn-s" style="height:20px;font-size:9px;padding:0 5px" title="${isSomeday?'Move to Inbox':'Move to Someday'}" onclick="event.stopPropagation();moveSomeday(${t.id})">${isSomeday?'📥':'💤'}</button><button class="btn btn-s" style="height:20px;font-size:9px;padding:0 5px" onclick="event.stopPropagation();openDrawer('task',D.tasks.find(x=>x.id===${t.id}))">✏</button><button class="btn btn-d" style="height:20px;font-size:9px;padding:0 5px" onclick="event.stopPropagation();deleteItem('task',${t.id})">✕</button></span>`:''}</div>`;
}
function addTaskComment(taskId){
  const inp=document.getElementById('new-comment');
  if(!inp||!inp.value.trim())return;
  const t=D.tasks.find(x=>x.id===taskId);
  if(!t)return;
  t.comments=t.comments||[];
  const now=new Date();
  const ts=now.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  t.comments.push({id:Date.now(),author:D.creds.userName||(D.teams[0]&&D.teams[0].members[0]&&D.teams[0].members[0].name)||'Idris',text:inp.value.trim(),ts});
  save('tasks');
  inp.value='';
  // Re-render comments panel inline
  const panel=document.getElementById('task-comments');
  if(panel)panel.innerHTML=t.comments.map(c=>`<div style="padding:5px 0;border-bottom:1px solid var(--s3)"><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--t3);margin-bottom:2px"><span>${esc(c.author||'Idris')}</span><span>${c.ts||''}</span></div><div style="font-size:11px">${esc(c.text)}</div></div>`).join('');

function delegateTask(id){
  const t=D.tasks.find(x=>x.id===id);
  if(!t)return;
  const members=D.teams.flatMap(tm=>tm.members).filter(m=>m.name!==(D.creds.userName||'Idris Grant'));
  if(!members.length){toast('No other team members to delegate to');return;}
  const opts=members.map((m,i)=>`${i+1}. ${m.name} (${m.role})`).join('\n');
  const choice=prompt(`Delegate "${t.title}" to:\n${opts}\n\nEnter number:`);
  if(!choice)return;
  const idx=parseInt(choice)-1;
  if(isNaN(idx)||idx<0||idx>=members.length){toast('Invalid selection');return;}
  const assignee=members[idx].name;
  t.assignedTo=assignee;
  t.status=t.status==='Not Started'?'Delegated':t.status;
  t.comments=t.comments||[];
  const ts=new Date().toLocaleString();
  t.comments.push({id:Date.now(),author:D.creds.userName||'Idris Grant',ts,text:`Delegated to ${assignee}`,type:'delegation'});
  save('tasks');
  toast(`📤 Task delegated to ${assignee}`);
  renderScreen(curScreen);
}
function togglePin(type,id){
  if(!D.prefs.pinned)D.prefs.pinned=[];
  const idx=D.prefs.pinned.findIndex(p=>p.type===type&&p.id===id);
  if(idx>=0){D.prefs.pinned.splice(idx,1);toast('📌 Unpinned');}
  else{D.prefs.pinned.push({type,id});toast('📌 Pinned to Home');}
  localStorage.setItem('lu_prefs',JSON.stringify(D.prefs));
  if(curScreen==='home')renderScreen('home');
}
function snoozeTask(id){
  const t=D.tasks.find(x=>x.id===id);
  if(!t)return;
  const tomorrow=new Date();
  tomorrow.setDate(tomorrow.getDate()+1);
  const ds=tomorrow.toISOString().slice(0,10);
  t.myDay=false;
  t.snoozeUntil=ds;
  t.due=t.due&&t.due!=='Carry Over'?t.due:ds;
  save('tasks');
  invalidateSearchIndex();
  if(document.getElementById('myday-main'))renderScreen('myday');
  else renderTaskList();
  toast(`💭 Snoozed until tomorrow (${tomorrow.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})})`);
}
function moveSomeday(id){
  const t=D.tasks.find(x=>x.id===id);
  if(!t)return;
  if(t.status==='Someday'){
    t.status='Not Started';
    toast('📥 Moved back to Inbox');
  } else {
    t.status='Someday';
    t.myDay=false;
    toast('💤 Moved to Someday');
  }
  save('tasks');
  renderScreen(curScreen);
}
function toggleTask(id){
  const t=D.tasks.find(x=>x.id===id);
  if(!t)return;
  const wasDone=t.status==='Done';
  t.status=wasDone?'Not Started':'Done';
  save('tasks');
  if(!wasDone&&t.recurring&&t.recurring!=='None')maybeSpawnRecurring(t);
  // Auto-recalc linked goal progress
  D.goals.forEach(g=>{
    if((g.linkedTaskIds||[]).includes(t.id))autoCalcGoalPct(g);
  });
  renderScreen(curScreen);
}

function buildNoteBacklinks(id){
  // Find notes whose body contains [[Title]] linking to this note
  const target=D.notes.find(n=>n.id===id);
  if(!target)return[];
  return D.notes.filter(n=>n.id!==id&&n.body&&n.body.includes('[['+target.title+']]'));
}
function buildNoteOutlinks(n){
  if(!n||!n.body)return[];
  const matches=[...n.body.matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>m[1]);
  return matches.map(title=>D.notes.find(x=>x.title===title)).filter(Boolean);
}
function renderNotesGraph(id){
  const n=D.notes.find(x=>x.id===id);
  if(!n)return '<div style="font-size:10px;color:var(--t3);text-align:center;padding:8px">Select a note</div>';
  const backlinks=buildNoteBacklinks(id);
  const outlinks=buildNoteOutlinks(n);
  const all=[...backlinks,...outlinks];
  if(!all.length)return '<div style="font-size:10px;color:var(--t3);text-align:center;padding:8px">No links. Use [[Note Title]] to link.</div>';
  const cx=80,cy=50,r=30;
  const nodes=[{id,title:n.title,x:cx,y:cy,main:true}];
  const links=[];
  const placed=new Set([id]);
  const total=all.length;
  all.forEach((ln,i)=>{
    if(placed.has(ln.id))return;
    placed.add(ln.id);
    const angle=(i/total)*2*Math.PI-Math.PI/2;
    nodes.push({id:ln.id,title:ln.title,x:cx+r*Math.cos(angle),y:cy+r*Math.sin(angle),main:false});
    links.push({from:id,to:ln.id,back:backlinks.includes(ln)});
  });
  const svgLinks=links.map(l=>{
    const from=nodes.find(x=>x.id===l.from);
    const to=nodes.find(x=>x.id===l.to);
    return`<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="${l.back?'#8B5CF6':'#3B82F6'}" stroke-width="1" opacity="0.6"/>`;
  }).join('');
  const svgNodes=nodes.map(nd=>{
    const short=nd.title.length>8?nd.title.slice(0,8)+'…':nd.title;
    return`<g style="cursor:pointer" onclick="showNoteInEditor(${nd.id})">
      <circle cx="${nd.x}" cy="${nd.y}" r="${nd.main?7:5}" fill="${nd.main?'#3B82F6':'#64748B'}" opacity="0.9"/>
      <text x="${nd.x}" y="${nd.y+14}" text-anchor="middle" font-size="6" fill="var(--t2)">${short}</text>
    </g>`;
  }).join('');
  return`<svg viewBox="0 0 160 100" style="width:100%;height:80px">${svgLinks}${svgNodes}</svg>`;
}

function filterNotesList(q){
  const el=document.getElementById('notes-list-inner');
  if(!el)return;
  if(!q){el.innerHTML=renderNotesList_html(_notesMyOnly);return;}
  const ql=q.toLowerCase();
  const me=D.creds.userName||'Idris Grant';
  const notes=(_notesMyOnly?D.notes.filter(n=>!n.createdBy||n.createdBy===me):D.notes).filter(n=>{
    return (n.title||'').toLowerCase().includes(ql)||
           (n.body||'').toLowerCase().includes(ql)||
           (n.tags||[]).some(t=>t.toLowerCase().includes(ql))||
           (n.source||'').toLowerCase().includes(ql);
  });
  el.innerHTML=notes.map((n,i)=>{
    // Highlight matching text in title
    const hiTitle=esc(n.title).replace(new RegExp(ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark style="background:var(--warns);color:var(--warn);border-radius:2px">${m}</mark>`);
    // Show matching body snippet
    const bodyLower=(n.body||'').toLowerCase();
    const idx=bodyLower.indexOf(ql);
    let snippet='';
    if(idx>=0){
      const start=Math.max(0,idx-30);
      const end=Math.min((n.body||'').length,idx+ql.length+50);
      snippet=esc((n.body||'').slice(start,end)).replace(new RegExp(ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark style="background:var(--warns);color:var(--warn);border-radius:2px">${m}</mark>`);
      if(start>0)snippet='…'+snippet;
      if(end<(n.body||'').length)snippet+=('…');
    }
    return `<div class="nc ${i===0?'on':''}" data-nid="${n.id}" onclick="showNoteInEditor(${n.id})"><div class="nc-t">${hiTitle}</div><div class="nc-tg">${(n.tags||[]).map(t=>`<span>#${t}</span>`).join('')}</div>${snippet?`<div style="font-size:9px;color:var(--t2);margin-top:2px;line-height:1.4">${snippet}</div>`:''}<div class="nc-m"><span>${n.source}</span><span>${n.updated}</span></div></div>`;
  }).join('')||'<p style="color:var(--t3);font-size:11px;padding:8px">No notes match "'+esc(q)+'".</p>';
}

function projectHealth(p){
  const pts=D.tasks.filter(t=>t.projectId===p.id&&t.status!=='Done');
  const overdue=pts.filter(t=>t.due&&t.due<_todayStr).length;
  const total=D.tasks.filter(t=>t.projectId===p.id).length;
  const overdueRatio=total>0?overdue/total:0;
  // Check deadline proximity
  let daysLeft=Infinity;
  if(p.due&&p.due!=='TBD'){
    const d=new Date(p.due);
    if(!isNaN(d))daysLeft=Math.ceil((d-new Date())/(1000*60*60*24));
  }
  if(overdueRatio>0.3||daysLeft<0)return{icon:'🔴',label:'At Risk',color:'var(--red)'};
  if(overdueRatio>0.1||daysLeft<=7)return{icon:'🟡',label:'Needs Attention',color:'var(--warn)'};
  return{icon:'🟢',label:'On Track',color:'var(--ok)'};
}

function renderProjectsGantt(header){
  // Simple CSS Gantt — compute week offsets from today
  const today=new Date();
  const parseDate=s=>{if(!s||s==='Ongoing')return null;try{return new Date(s)}catch{return null}};
  const allDates=D.projects.map(p=>parseDate(p.due)).filter(Boolean);
  const minDate=new Date(today); minDate.setDate(minDate.getDate()-7);
  const maxDate=allDates.length?new Date(Math.max(...allDates.map(d=>d.getTime()))):new Date(today.getTime()+90*86400000);
  const totalDays=Math.max(1,Math.ceil((maxDate-minDate)/86400000))+14;
  const pct=(d)=>Math.max(0,Math.min(100,Math.ceil((new Date(d)-minDate)/86400000/totalDays*100)));
  const rows=D.projects.map(p=>{
    const due=parseDate(p.due);
    const startPct=Math.max(0,pct(new Date(today.getTime()-14*86400000)));
    const endPct=due?pct(due):80;
    const barW=Math.max(2,endPct-startPct);
    return`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd1)">
      <div style="width:140px;flex-shrink:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" onclick="openProjectDetail(${p.id})" title="${esc(p.name)}">
        <span style="width:7px;height:7px;border-radius:2px;background:${p.color};display:inline-block;margin-right:4px"></span>${esc(p.name)}
      </div>
      <div style="flex:1;position:relative;height:18px;background:var(--s3);border-radius:3px;overflow:hidden">
        <div style="position:absolute;left:${startPct}%;width:${barW}%;height:100%;background:${p.color};border-radius:3px;opacity:.85;display:flex;align-items:center;padding:0 4px">
          <span style="font-size:9px;color:#fff;white-space:nowrap;overflow:hidden">${p.pct}%</span>
        </div>
        <div style="position:absolute;left:${pct(today)}%;top:0;bottom:0;width:1px;background:var(--warn);opacity:.7"></div>
      </div>
      <div style="width:60px;flex-shrink:0;font-size:9px;color:var(--t3);text-align:right">${p.due||'—'}</div>
    </div>`}).join('');
  $('proj-main').innerHTML=header+`<div style="font-size:11px;color:var(--t3);margin-bottom:8px">Yellow line = today. Bars span from project start to due date.</div><div>${rows}</div>`;
}

function toggleMilestone(goalId,idx){
  const g=D.goals.find(x=>x.id===goalId);
  if(!g||!g.milestones[idx])return;
  g.milestones[idx].done=!g.milestones[idx].done;
  save('goals');
  const list=document.getElementById('ms-list');
  if(list){
    const ms=g.milestones;
    list.innerHTML=ms.map((m,mi)=>`<div class="lr" style="padding:4px 0"><div class="chk ${m.done?'on':''}" onclick="toggleMilestone(${goalId},${mi})"></div><span class="rt" style="font-size:11px;${m.done?'text-decoration:line-through;color:var(--t3)':''}">${esc(m.title)}</span><span style="font-size:9px;color:var(--t3)">${m.due||''}</span></div>`).join('');
  }
  toast(g.milestones[idx].done?'🏁 Milestone complete!':'Milestone unmarked');
}
function addMilestone(goalId){
  const g=D.goals.find(x=>x.id===goalId);
  if(!g)return;
  const inp=document.getElementById('new-ms');
  const due=document.getElementById('new-ms-due');
  const title=(inp?.value||'').trim();
  if(!title){toast('Enter a milestone title');return;}
  if(!g.milestones)g.milestones=[];
  g.milestones.push({id:Date.now(),title,done:false,due:due?.value||''});
  save('goals');
  const list=document.getElementById('ms-list');
  if(list){
    const ms=g.milestones;
    list.innerHTML=ms.map((m,mi)=>`<div class="lr" style="padding:4px 0"><div class="chk ${m.done?'on':''}" onclick="toggleMilestone(${goalId},${mi})"></div><span class="rt" style="font-size:11px;${m.done?'text-decoration:line-through;color:var(--t3)':''}">${esc(m.title)}</span><span style="font-size:9px;color:var(--t3)">${m.due||''}</span></div>`).join('');
  }
  inp.value=''; if(due)due.value='';
  toast('Milestone added');
}

function saveNewCalEvent(){

  const startVal=document.getElementById('nev-start')?.value||'09:00';
  const endVal=document.getElementById('nev-end')?.value||'10:00';
  const [sh,sm]=startVal.split(':').map(Number);
  const [eh,em]=endVal.split(':').map(Number);
  const fmt=h=>{const ampm=h>=12?'PM':'AM';const h12=h%12||12;return`${h12}:${String(h%60===0?'00':h%60).padStart(2,'0')} ${ampm}`};
  const day=parseInt(document.getElementById('nev-day')?.value||'0');
  const color=document.getElementById('nev-color')?.value||'var(--ac)';
  const loc=document.getElementById('nev-loc')?.value||'';
  const att=document.getElementById('nev-att')?.value||'';
  const desc=document.getElementById('nev-desc')?.value||'';
  const repeat=document.getElementById('nev-repeat')?.value||'none';
  const recurId=repeat!=='none'?Date.now():null;
  const baseEv={id:Date.now(),title,time:fmt(sh),end:fmt(eh),day,hour:sh,color,location:loc,attendees:att?att.split(',').map(s=>s.trim()).filter(Boolean):[],desc,repeat,recurId};
  _calEvents.push(baseEv);
  // Generate future occurrences (up to 12 weeks ahead)
  if(repeat!=='none'){
    const weekGap=repeat==='daily'?1/7:repeat==='biweekly'?2:1;
    const maxWeeks=repeat==='daily'?14:12;
    for(let w=1;w<=maxWeeks;w++){
      if(repeat==='daily'||repeat==='weekly'||(repeat==='biweekly'&&w%2===0)||repeat==='monthly'){
        if(repeat==='monthly'&&w%4!==0)continue;
        _calEvents.push({...baseEv,id:Date.now()+w,recurId,_recurWeek:w});
      }
    }
  }
  closeModal();
  renderCal();
  toast(`✓ Event added${repeat!=='none'?' (recurring)':''}!`);
}

function getMdExecSummary(filter){
  let tasks=D.tasks.filter(t=>t.myDay);

  else if(filter==='quickwin')tasks=tasks.filter(t=>t.status!=='Done'&&(t.estimatedMins||999)<=15);
  else if(filter==='pending')tasks=tasks.filter(t=>t.status!=='Done');
  else if(filter==='done')tasks=tasks.filter(t=>t.status==='Done');
  const total=tasks.reduce((s,t)=>s+(t.estimatedMins||0),0);
  const done=tasks.filter(t=>t.status==='Done').length;
  const pending=tasks.filter(t=>t.status!=='Done').length;
  if(!tasks.length)return '';
  const hrs=Math.floor(total/60),mins=total%60;
  const timeStr=total?`⏱ ${hrs?hrs+'h ':''}${mins?mins+'m':''} estimated`:'⏱ No estimates set';
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  return `<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--s2);border-radius:6px;margin-bottom:8px;font-size:10px;color:var(--t2);flex-wrap:wrap">

    <span style="color:var(--t3)">·</span>

// ====== POMODORO FOCUS TIMER ======
let _pomoInterval=null,_pomoSecs=25*60,_pomoTotal=25*60,_pomoRunning=false,_pomoSession=1,_pomoTaskId=null;
function pomoSetMode(mins){
  if(_pomoRunning)pomoToggle();
  _pomoTotal=parseInt(mins)*60;
  _pomoSecs=_pomoTotal;
  _pomoUpdateDisplay();
}
function _pomoUpdateDisplay(){
  const m=Math.floor(_pomoSecs/60),s=_pomoSecs%60;
  const el=document.getElementById('pomo-timer');
  if(el)el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  const prog=document.getElementById('pomo-progress');
  if(prog)prog.style.width=(((_pomoTotal-_pomoSecs)/_pomoTotal)*100)+'%';
  const sess=document.getElementById('pomo-sessions');
  if(sess)sess.textContent='Session '+_pomoSession+' of 4';
}
function pomoToggle(){
  const btn=document.getElementById('pomo-btn');
  if(_pomoRunning){
    clearInterval(_pomoInterval);
    _pomoRunning=false;
    if(btn)btn.textContent='▶ Resume';
  } else {
    _pomoRunning=true;
    if(btn)btn.textContent='⏸ Pause';
    _pomoInterval=setInterval(()=>{
      _pomoSecs--;
      _pomoUpdateDisplay();
      if(_pomoSecs<=0){
        clearInterval(_pomoInterval);
        _pomoRunning=false;
        const isBreak=_pomoTotal<=15*60&&_pomoTotal>=5*60;
        if(!isBreak){
          // Mark linked task done if one is selected
          if(_pomoTaskId){
            const t=D.tasks.find(x=>x.id===_pomoTaskId);
            if(t&&t.status!=='Done'){toggleTask(_pomoTaskId);}
          }
          // Log focus time to D.prefs
          D.prefs=D.prefs||{};
          D.prefs.focusMinsToday=(D.prefs.focusMinsToday||0)+Math.round(_pomoTotal/60);
          // Record in 7-day rolling log
          const _today=new Date().toISOString().split('T')[0];
          D.prefs.focusLog=D.prefs.focusLog||{};
          D.prefs.focusLog[_today]=(D.prefs.focusLog[_today]||0)+Math.round(_pomoTotal/60);
          // Trim to last 30 days
          const _keys=Object.keys(D.prefs.focusLog).sort();
          if(_keys.length>30)_keys.slice(0,_keys.length-30).forEach(k=>delete D.prefs.focusLog[k]);
          save('prefs');
          _pomoSession=Math.min(_pomoSession+1,4);
          toast('🍅 Focus session complete! Take a break.');
          // Auto-switch to 5-min break
          _pomoTotal=5*60;
          _pomoSecs=5*60;
          const sel=document.getElementById('pomo-mode');
          if(sel)sel.value='5';
          const lbl=document.getElementById('pomo-label');
          if(lbl)lbl.textContent='Break';
        } else {
          toast('⚡ Break over! Back to focus.');
          _pomoTotal=25*60;
          _pomoSecs=25*60;
          const sel=document.getElementById('pomo-mode');
          if(sel)sel.value='25';
          const lbl=document.getElementById('pomo-label');
          if(lbl)lbl.textContent='Focus';
        }
        _pomoUpdateDisplay();
        if(btn)btn.textContent='▶ Start';
      }
    },1000);
  }
}
function pomoReset(){
  clearInterval(_pomoInterval);
  _pomoRunning=false;
  const sel=document.getElementById('pomo-mode');
  _pomoTotal=(sel?parseInt(sel.value):25)*60;
  _pomoSecs=_pomoTotal;
  _pomoUpdateDisplay();
  const btn=document.getElementById('pomo-btn');
  if(btn)btn.textContent='▶ Start';
}
function pomoSelectTask(taskId){

function getWeekDates(offsetWeeks=0){
  const now=new Date();
  const day=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)+offsetWeeks*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}

      <div style="font-size:10px;font-weight:600;text-align:center;margin-bottom:5px;color:${isToday?'var(--ac)':'var(--t2)'}">${label(d)}${isToday?' • Today':''}</div>
      <div id="wkday-${ds}" style="min-height:60px">

function skipHabitToday(id){
  const h=D.habits.find(x=>x.id===id);
  if(!h)return;
  h.skippedToday=true;
  h.doneToday=false;
  save('habits');
  renderHabits();

function toggleHabit(id){
  const h=D.habits.find(x=>x.id===id);
  if(!h)return;
  const wasOff=!h.doneToday;
  h.doneToday=wasOff;
  h.skippedToday=false; // un-skip if checking in
  if(wasOff){h.streak=(h.streak||0)+1;toast(h.icon+' '+h.title+' \u2014 \ud83d\udd25 '+h.streak+' day streak!');}

function saveHabit(hid){
  const title=document.getElementById('hdr-title')?.value.trim();
  if(!title){toast('Title required');return;}
  const data={
    title,
    icon:document.getElementById('hdr-icon')?.value||'✅',
    category:document.getElementById('hdr-cat')?.value||'',
    cadence:document.getElementById('hdr-cadence')?.value||'Daily',
    startTime:document.getElementById('hdr-start')?.value||'',
    reminderTime:document.getElementById('hdr-reminder')?.value||'',
    linkedTaskId:document.getElementById('hdr-task')?.value?parseInt(document.getElementById('hdr-task').value):null,
    notes:document.getElementById('hdr-notes')?.value||'',
  };
  if(hid){
    const h=D.habits.find(x=>x.id===hid);
    if(h)Object.assign(h,data);
  } else {
    D.habits.push({id:nextId(D.habits),streak:0,doneToday:false,...data});
  }
  save('habits');
  closeDrawer();
  renderScreen('habits');
  toast(hid?'Habit updated!':'Habit created!');
}
function deleteHabit(hid){
  if(!confirm('Delete this habit?'))return;
  D.habits=D.habits.filter(x=>x.id!==hid);
  save('habits');
  closeDrawer();
  renderScreen('habits');
  toast('Habit deleted');
}

function renderCoach(){
  // ---- Compute real insights from data ----
  const now=new Date();
  const todayStr=now.toISOString().split('T')[0];
  const dayOfWeek=now.getDay();
  const monDate=new Date(now);monDate.setDate(now.getDate()-(dayOfWeek===0?6:dayOfWeek-1));monDate.setHours(0,0,0,0);
  const weekStart=monDate.toISOString().split('T')[0];
  const sunDate=new Date(monDate);sunDate.setDate(monDate.getDate()+6);
  const weekEnd=sunDate.toISOString().split('T')[0];

  // Tasks
  const doneTasks=D.tasks.filter(t=>t.status==='Done');
  const pendingTasks=D.tasks.filter(t=>t.status!=='Done'&&t.status!=='Someday');
  const overdueTasks=D.tasks.filter(t=>t.due&&t.due<todayStr&&t.status!=='Done');
  const highPending=pendingTasks.filter(t=>t.priority==='High');
  const weekTasks=D.tasks.filter(t=>{const d=t.startDate||t.due||'';return d>=weekStart&&d<=weekEnd;});
  const weekDone=weekTasks.filter(t=>t.status==='Done');
  const completionRate=weekTasks.length?Math.round(weekDone.length/weekTasks.length*100):0;

  // Habits
  const dailyHabits=D.habits.filter(h=>h.cadence==='Daily');
  const doneHabitsToday=dailyHabits.filter(h=>h.doneToday);
  const habitRate=dailyHabits.length?Math.round(doneHabitsToday.length/dailyHabits.length*100):0;
  const topStreak=D.habits.reduce((best,h)=>h.streak>best.streak?h:best,{streak:0,title:'—',icon:''});
  const neglectedHabits=D.habits.filter(h=>!h.doneToday&&h.cadence==='Daily');

  // Goals
  const goalsOnTrack=D.goals.filter(g=>g.pct>=50);
  const goalsBehind=D.goals.filter(g=>g.pct<30&&g.dueDate&&g.dueDate>todayStr);
  const nearDueGoals=D.goals.filter(g=>{if(!g.dueDate)return false;const diff=(new Date(g.dueDate)-now)/(1000*60*60*24);return diff>=0&&diff<=14;});

  // Focus
  const focusLog=D.prefs&&D.prefs.focusLog||{};
  const focusToday=D.prefs&&D.prefs.focusMinsToday||0;
  const focusWeek=Object.entries(focusLog).filter(([d])=>d>=weekStart&&d<=weekEnd).reduce((s,[,v])=>s+v,0)+focusToday;
  const focusAvgDay=weekTasks.length?Math.round(focusWeek/7):0;

  // Build insight cards
  const observations=[];
  const encouragements=[];
  const warnings=[];
  const nudges=[];

  // Observations
  observations.push({t:`This week: ${weekDone.length}/${weekTasks.length} tasks done (${completionRate}%)`,b:`${weekTasks.length-weekDone.length} tasks still pending this week.`,a:weekTasks.length?`<button class="btn btn-s" style="height:20px;font-size:9px" onclick="nav('myweek')">View Week</button>`:''});
  if(focusWeek>0)observations.push({t:`${focusWeek}m focus time this week`,b:`That's roughly ${Math.round(focusWeek/60*10)/10}h of deep work. Daily average: ${focusAvgDay}m.`,a:''});
  observations.push({t:`Habits: ${habitRate}% done today`,b:`${doneHabitsToday.length} of ${dailyHabits.length} daily habits completed.`,a:dailyHabits.length?`<button class="btn btn-s" style="height:20px;font-size:9px" onclick="nav('habits')">View Habits</button>`:''});
  if(goalsOnTrack.length)observations.push({t:`${goalsOnTrack.length} goal${goalsOnTrack.length>1?'s':''} on track (≥50%)`,b:goalsOnTrack.map(g=>g.icon+' '+g.title+' — '+g.pct+'%').join(', '),a:''});

  // Encouragements
  if(topStreak.streak>=7)encouragements.push({t:`🔥 ${topStreak.streak}-day streak on "${topStreak.icon} ${topStreak.title}"!`,b:'Consistency is compounding. Keep it going!'});
  if(completionRate>=70)encouragements.push({t:`Strong week — ${completionRate}% task completion!`,b:'You\'re in the top tier of productive weeks. Finish strong.'});
  if(doneTasks.length>0)encouragements.push({t:`${doneTasks.length} task${doneTasks.length>1?'s':''} completed overall`,b:'Every done item is momentum. Great work, '+((D.creds.userName||'Idris').split(' ')[0])+'!'});
  if(encouragements.length===0)encouragements.push({t:'You\'re showing up — that\'s what matters.',b:'Start small, stay consistent. Today is a fresh page.'});

  // Warnings
  if(overdueTasks.length)warnings.push({t:`${overdueTasks.length} overdue task${overdueTasks.length>1?'s':''}`,b:overdueTasks.slice(0,3).map(t=>t.title).join(', ')+(overdueTasks.length>3?'...':''),a:`<button class="btn btn-s" style="height:20px;font-size:9px" onclick="nav('tasks')">Review Tasks</button>`});
  if(highPending.length>=5)warnings.push({t:`${highPending.length} high-priority tasks pending`,b:'Consider delegating or deferring some to stay focused.',a:''});
  if(neglectedHabits.length&&now.getHours()>=18)warnings.push({t:`${neglectedHabits.length} habit${neglectedHabits.length>1?'s':''} not done today`,b:neglectedHabits.map(h=>h.icon+' '+h.title).join(', '),a:`<button class="btn btn-s" style="height:20px;font-size:9px" onclick="nav('habits')">Check In</button>`});
  if(nearDueGoals.length)warnings.push({t:`${nearDueGoals.length} goal${nearDueGoals.length>1?'s':''} due within 14 days`,b:nearDueGoals.map(g=>g.icon+' '+g.title+' ('+g.dueDate+')').join(', '),a:`<button class="btn btn-s" style="height:20px;font-size:9px" onclick="nav('goals')">Review Goals</button>`});
  if(goalsBehind.length)warnings.push({t:`${goalsBehind.length} goal${goalsBehind.length>1?'s':''} behind (<30%)`,b:goalsBehind.map(g=>g.icon+' '+g.title+' — '+g.pct+'%').join(', '),a:''});

  // Daily nudges based on time of day
  const hr=now.getHours();
  if(hr<10)nudges.push({t:'Morning Ritual',b:'Start with your top 3 priorities. What\'s the one thing that would make today a win?',a:`<button class="btn btn-p" style="height:22px;font-size:9px" onclick="nav('myday')">Open My Day</button>`});
  else if(hr<13)nudges.push({t:'Mid-Morning Check-in',b:`You have ${pendingTasks.filter(t=>t.myDay).length} tasks on My Day. Stay in deep work mode.`,a:`<button class="btn btn-p" style="height:22px;font-size:9px" onclick="nav('myday')">Execute</button>`});
  else if(hr<17)nudges.push({t:'Afternoon Focus',b:'Energy typically dips after 2 PM. Consider a 5-min break or a Pomodoro sprint.',a:`<button class="btn btn-p" style="height:22px;font-size:9px" onclick="nav('myday')">Start Timer</button>`});
  else nudges.push({t:'Evening Wrap-Up',b:'Great time to complete your daily reflection and plan tomorrow\'s top 3.',a:`<button class="btn btn-p" style="height:22px;font-size:9px" onclick="nav('myday')">Wrap Up</button>`});

  function insCard(items,cls){return items.map(i=>`<div class="ins ${cls}" style="margin-bottom:8px"><div style="font-size:12px;font-weight:500;margin-bottom:3px">${i.t}</div><div style="font-size:11px;color:var(--t2);line-height:1.5">${i.b}</div>${i.a?`<div style="margin-top:6px">${i.a}</div>`:''}</div>`).join('');}

    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--ac)">${completionRate}%</div><div style="font-size:9px;color:var(--t3)">Week Tasks</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--ok)">${habitRate}%</div><div style="font-size:9px;color:var(--t3)">Habits Today</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--warn)">${overdueTasks.length}</div><div style="font-size:9px;color:var(--t3)">Overdue</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--ac)">${focusToday}m</div><div style="font-size:9px;color:var(--t3)">Focus Today</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--ok)">${topStreak.streak}🔥</div><div style="font-size:9px;color:var(--t3)">Top Streak</div></div>
  </div>
  ${nudges.length?`<div class="sec-h" style="color:var(--ac)">💡 Right Now</div>${insCard(nudges,'obs')}`:''}
  <div class="sec-h">📊 Observations</div>${insCard(observations,'obs')}
  <div class="sec-h" style="color:var(--ok)">🌟 Encouragement</div>${insCard(encouragements,'enc')}
  ${warnings.length?`<div class="sec-h" style="color:var(--warn)">⚠️ Needs Attention</div>${insCard(warnings,'wrn')}`:''}
  `;
  $('coach-rail').innerHTML=`
  <div style="font-size:12px;font-weight:600;margin-bottom:8px">🎯 Daily Priorities</div>

function renderTeam(){
  const allMembers=D.teams.flatMap(t=>t.members);
  const today=new Date().toISOString().split('T')[0];
  function memberCard(m){
    const tasks=D.tasks.filter(t=>t.createdBy===m.name);
    const done=tasks.filter(t=>t.status==='Done').length;
    const overdue=tasks.filter(t=>t.status!=='Done'&&t.due&&t.due<today).length;
    const habits=D.habits.filter(h=>h.createdBy===m.name);
    const habitsDone=habits.filter(h=>h.doneToday).length;
    const topStreak=habits.reduce((max,h)=>Math.max(max,h.streak||0),0);
    const goals=D.goals.filter(g=>g.createdBy===m.name);
    const avgGoalPct=goals.length?Math.round(goals.reduce((s,g)=>s+g.pct,0)/goals.length):null;
    const initials=m.name.split(' ').map(w=>w[0]).join('');
    return`<div class="cd" style="padding:14px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="width:40px;height:40px;border-radius:50%;background:${m.color};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0">${initials}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">${esc(m.name)}</div>
          <div style="font-size:10px;color:var(--t3)">${m.role} · ${esc(m.email)}</div>
        </div>
        <span style="font-size:9px;padding:2px 7px;border-radius:10px;background:var(--acs);color:var(--ac);font-weight:600">${m.role}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">
        <div style="text-align:center;padding:6px;background:var(--s2);border-radius:6px"><div style="font-size:16px;font-weight:700;color:var(--ac)">${tasks.length}</div><div style="font-size:8px;color:var(--t3)">Tasks</div></div>
        <div style="text-align:center;padding:6px;background:var(--s2);border-radius:6px"><div style="font-size:16px;font-weight:700;color:var(--ok)">${done}</div><div style="font-size:8px;color:var(--t3)">Done</div></div>
        <div style="text-align:center;padding:6px;background:var(--s2);border-radius:6px"><div style="font-size:16px;font-weight:700;color:${overdue?'var(--red)':'var(--t3)'}">${overdue}</div><div style="font-size:8px;color:var(--t3)">Overdue</div></div>
        <div style="text-align:center;padding:6px;background:var(--s2);border-radius:6px"><div style="font-size:16px;font-weight:700;color:var(--warn)">🔥${topStreak}</div><div style="font-size:8px;color:var(--t3)">Streak</div></div>
      </div>
      ${habits.length?`<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:600;margin-bottom:4px">✅ Habits Today: ${habitsDone}/${habits.length}</div><div style="background:var(--s3);border-radius:3px;height:5px"><div style="background:var(--ok);height:100%;width:${habits.length?Math.round(habitsDone/habits.length*100):0}%;border-radius:3px"></div></div></div>`:''}
      ${avgGoalPct!==null?`<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:600;margin-bottom:4px">🎯 Goals Avg: ${avgGoalPct}%</div><div class="pb"><div class="f" style="width:${avgGoalPct}%;background:var(--ac)"></div></div></div>`:''}
      <div style="font-size:10px;font-weight:600;margin-bottom:4px">📋 Active Tasks</div>
      ${tasks.filter(t=>t.status!=='Done').slice(0,3).map(t=>`<div class="lr" style="padding:2px 0;font-size:10px" onclick="openDrawer('task',D.tasks.find(x=>x.id===${t.id}))"><div class="chk ${t.status==='Done'?'on':''}"></div><span class="rt">${esc(t.title)}</span><span class="pill ${pillClass(t.priority)}" style="font-size:8px">${t.priority}</span></div>`).join('') || '<div style="font-size:10px;color:var(--t3);padding:4px 0">No active tasks</div>'}
    </div>`;
  }
  const teamName=D.teams[0]?D.teams[0].name:'Team';
  $('team-main').innerHTML=`<div class="ph-r" style="margin-bottom:16px"><div><h1 style="font-size:22px;font-weight:700">👥 Team Dashboard</h1><p style="font-size:12px;color:var(--t2)">${teamName} · ${allMembers.length} members</p></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">${allMembers.map(m=>memberCard(m)).join('')}</div>`;
  const totalTasks=D.tasks.length;
  const doneTasks=D.tasks.filter(t=>t.status==='Done').length;
  const overdueTasks=D.tasks.filter(t=>t.status!=='Done'&&t.due&&t.due<today).length;
  const habitsDoneToday=D.habits.filter(h=>h.doneToday).length;
  $('team-rail').innerHTML=`<div style="font-size:12px;font-weight:600;margin-bottom:8px">📊 Team Stats</div>
  <div class="stat"><div class="stat-n">${allMembers.length}</div><div class="stat-l">Members</div></div>
  <div class="stat"><div class="stat-n" style="color:var(--ok)">${doneTasks}</div><div class="stat-l">Tasks Done</div></div>
  <div class="stat"><div class="stat-n" style="color:${overdueTasks?'var(--red)':'var(--t3)'}">${overdueTasks}</div><div class="stat-l">Overdue</div></div>
  <div class="stat"><div class="stat-n" style="color:var(--ok)">${habitsDoneToday}</div><div class="stat-l">Habits Today</div></div>
  <div style="margin-top:12px;font-size:12px;font-weight:600;margin-bottom:6px">📊 Task Completion</div>
  <div class="pb"><div class="f" style="width:${totalTasks?Math.round(doneTasks/totalTasks*100):0}%;background:var(--ok)"></div></div>
  <div style="font-size:10px;color:var(--t2);margin-top:3px">${doneTasks} of ${totalTasks} tasks done</div>
  <div style="margin-top:12px;font-size:12px;font-weight:600;margin-bottom:6px">👥 Members</div>
  ${allMembers.map(m=>{const initials=m.name.split(' ').map(w=>w[0]).join('');return`<div class="lr" style="padding:4px 0"><div style="width:24px;height:24px;border-radius:50%;background:${m.color};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0">${initials}</div><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:500">${esc(m.name)}</div><div style="font-size:9px;color:var(--t3)">${m.role}</div></div></div>`}).join('')}`;
}
