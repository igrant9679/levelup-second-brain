<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LevelUp - The Second Brain</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0F1A;--s1:#0F1525;--s2:#161D2E;--s3:#1E2740;--s4:#252F4A;--bd1:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.10);--bd3:rgba(255,255,255,.16);--t1:#F8FAFC;--t2:#94A3B8;--t3:#64748B;--t4:#475569;--ac:#3B82F6;--ach:#60A5FA;--acs:rgba(59,130,246,.15);--red:#F87171;--reds:rgba(239,68,68,.15);--warn:#FBBF24;--warns:rgba(245,158,11,.15);--ok:#4ADE80;--oks:rgba(34,197,94,.15);--purp:#C084FC;--purps:rgba(168,85,247,.15);--top:56px;--side:220px;--r:8px}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:3px}
.app{display:grid;grid-template-rows:var(--top) 1fr;height:100vh}

/* TOPBAR */
.topbar{background:var(--s1);border-bottom:1px solid var(--bd1);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.logo svg{width:28px;height:28px}
.logo b{font-size:15px;font-weight:700;background:linear-gradient(135deg,#3B82F6,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo small{font-size:10px;color:var(--t3);display:block;line-height:1;margin-top:-2px}
.tb-s{flex:1;max-width:400px;margin:0 auto;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);display:flex;align-items:center;padding:0 10px;height:32px;gap:6px}
.tb-s input{flex:1;background:none;border:none;color:var(--t1);font-size:12px;outline:none}
.tb-s input::placeholder{color:var(--t3)}
.tb-a{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tbtn{width:32px;height:32px;border-radius:var(--r);background:none;border:none;color:var(--t2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.tbtn:hover{background:var(--s3);color:var(--t1)}
.tbtn .bg{position:absolute;top:1px;right:1px;min-width:14px;height:14px;background:var(--ac);color:#fff;font-size:8px;font-weight:700;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.bn{background:var(--ac);color:#fff;border:none;border-radius:var(--r);padding:0 12px;height:32px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
.bn:hover{background:var(--ach)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer}

/* LAYOUT */
.bg{display:grid;grid-template-columns:var(--side) 1fr;min-height:0}
.bg.wr{grid-template-columns:var(--side) 1fr 280px}

/* SIDEBAR */
.sb{background:var(--s1);border-right:1px solid var(--bd1);display:flex;flex-direction:column;padding:8px 0;overflow-y:auto;flex-shrink:0}
.si{display:flex;align-items:center;gap:8px;padding:5px 10px;margin:0 8px 1px;border-radius:6px;color:var(--t2);font-size:12px;cursor:pointer;transition:all .12s;user-select:none;position:relative}
.si:hover{background:var(--s3);color:var(--t1)}.si.on{background:var(--acs);color:var(--ach);font-weight:500}
.si.on::before{content:'';position:absolute;left:-8px;top:4px;bottom:4px;width:3px;background:var(--ac);border-radius:0 2px 2px 0}
.si svg{width:15px;height:15px;flex-shrink:0}.si .l{flex:1}.si .c{font-size:9px;font-weight:600;color:var(--t3);background:var(--s3);padding:1px 5px;border-radius:9px}.si.on .c{background:var(--ac);color:#fff}
.sd{height:1px;background:var(--bd1);margin:6px 14px}
.su{margin-top:auto;padding:8px 14px;border-top:1px solid var(--bd1);display:flex;align-items:center;gap:8px;font-size:11px}

/* MAIN */
.mn{padding:16px 24px;overflow-y:auto;min-width:0}.rr{background:var(--s1);border-left:1px solid var(--bd1);padding:14px;overflow-y:auto}
.scr{display:none}.scr.on{display:contents}

/* SHARED */
.cd{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:12px;margin-bottom:12px}
.cd-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cd-t{font-size:13px;font-weight:500;display:flex;align-items:center;gap:5px}
.cd-a{font-size:10px;color:var(--ac);cursor:pointer}.cd-a:hover{color:var(--ach)}
.pill{display:inline-flex;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:600;white-space:nowrap}
.p-h{background:var(--reds);color:var(--red)}.p-m{background:var(--warns);color:var(--warn)}.p-l{background:var(--oks);color:var(--ok)}
.p-ip{background:rgba(59,130,246,.15);color:#60A5FA}.p-pe{background:var(--warns);color:var(--warn)}.p-ns{background:rgba(148,163,184,.15);color:#CBD5E1}
.p-sc{background:var(--purps);color:var(--purp)}.p-dn{background:var(--oks);color:var(--ok)}
.pb{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;flex:1}.pb .f{height:100%;border-radius:2px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:0 12px;height:30px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .12s;white-space:nowrap}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ach)}
.btn-s{background:var(--s3);color:var(--t1);border:1px solid var(--bd2)}.btn-s:hover{background:var(--s4)}
.btn-d{background:var(--reds);color:var(--red)}.btn-d:hover{opacity:.8}
.chk{width:14px;height:14px;border:1.5px solid var(--bd3);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chk:hover{border-color:var(--ac)}.chk.on{background:var(--ac);border-color:var(--ac)}.chk.on::after{content:'✓';color:#fff;font-size:9px;font-weight:700}
.tabs{display:flex;gap:2px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer}.tab:hover{background:var(--s3);color:var(--t1)}.tab.on{background:var(--acs);color:var(--ach)}
.tab .tc{font-size:9px;background:var(--s3);padding:1px 4px;border-radius:6px;margin-left:3px}.tab.on .tc{background:var(--ac);color:#fff}
.lr{display:flex;align-items:center;gap:7px;padding:6px 4px;border-bottom:1px solid var(--bd1);font-size:11px;cursor:pointer;border-radius:4px;transition:background .1s}
.lr:last-child{border-bottom:none}.lr:hover{background:rgba(255,255,255,.03);color:var(--t1)}
.lr .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .rm{font-size:10px;color:var(--t3);white-space:nowrap}
.lr .acts{display:none;gap:3px}.lr:hover .acts{display:flex}
.add-c{display:flex;align-items:center;gap:4px;padding:5px 0;font-size:11px;color:var(--ac);cursor:pointer}.add-c:hover{color:var(--ach)}
.tog{width:36px;height:18px;border-radius:9px;background:var(--s4);position:relative;cursor:pointer;transition:.15s;flex-shrink:0}
.tog.on{background:var(--ac)}.tog::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}.tog.on::after{transform:translateX(18px)}
.inp{background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:6px 10px;color:var(--t1);font-size:12px;outline:none;width:100%;font-family:inherit}
.inp:focus{border-color:var(--ac)}textarea.inp{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.pg-h{margin-bottom:14px}.pg-h h1{font-size:22px;font-weight:700}.pg-h p{color:var(--t2);font-size:12px;margin-top:2px}
.ph-r{display:flex;align-items:center;justify-content:space-between}
.subnav{display:flex;gap:2px;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:3px;margin-bottom:12px}
.sn{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer}.sn:hover{color:var(--t1)}.sn.on{background:var(--ac);color:#fff}
.sec-h{font-size:14px;font-weight:600;padding:10px 0 6px;border-bottom:2px solid var(--bd2);margin-bottom:10px}
.stat{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:8px;text-align:center}
.stat-n{font-size:20px;font-weight:700;line-height:1}.stat-l{font-size:10px;color:var(--t3);margin-top:2px}

/* DETAIL DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;justify-content:flex-end}
.drawer-overlay.show{display:flex}
.drawer{width:520px;max-width:90vw;background:var(--s1);border-left:1px solid var(--bd2);padding:20px;overflow-y:auto;animation:slideIn .2s ease}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.drawer h2{font-size:18px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.drawer .close{margin-left:auto;width:28px;height:28px;border-radius:6px;background:var(--s3);border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer .close:hover{background:var(--s4);color:var(--t1)}
.drawer .field{margin-bottom:10px}
.drawer .field label{display:block;font-size:11px;font-weight:500;color:var(--t2);margin-bottom:3px}
.drawer .field-row{display:flex;gap:8px;margin-bottom:10px}
.drawer .field-row>*{flex:1}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-ov.show{display:flex}
.modal{background:var(--s2);border:1px solid var(--bd2);border-radius:12px;padding:20px;width:520px;max-width:95vw;max-height:85vh;overflow-y:auto;animation:popIn .2s ease}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal h2{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.modal .close{margin-left:auto;width:26px;height:26px;border-radius:6px;background:var(--s3);border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}

/* AI ASSISTANT BUBBLE */
.ai-bubble{position:fixed;bottom:20px;right:20px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.ai-msg{background:linear-gradient(135deg,#1E3A5F,#1E2740);border:1px solid rgba(59,130,246,.3);border-radius:12px 12px 4px 12px;padding:10px 14px;max-width:340px;font-size:12px;color:var(--t1);pointer-events:auto;animation:aiSlide .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.4);position:relative}
@keyframes aiSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ai-msg .ai-close{position:absolute;top:4px;right:6px;background:none;border:none;color:var(--t3);cursor:pointer;font-size:12px;padding:2px}
.ai-msg .ai-close:hover{color:var(--t1)}
.ai-msg .ai-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.ai-msg .ai-type.reminder{color:var(--ac)}.ai-msg .ai-type.warning{color:var(--warn)}.ai-msg .ai-type.encourage{color:var(--ok)}.ai-msg .ai-type.info{color:var(--purp)}.ai-msg .ai-type.news{color:#F97316}
.ai-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6);border:none;color:#fff;font-size:20px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(59,130,246,.4);transition:transform .15s}
.ai-btn:hover{transform:scale(1.08)}
.ai-btn.pulse{animation:aiPulse 2s infinite}
@keyframes aiPulse{0%,100%{box-shadow:0 4px 20px rgba(59,130,246,.4)}50%{box-shadow:0 4px 30px rgba(59,130,246,.7)}}

/* AI CHAT PANEL */
.ai-panel{position:fixed;bottom:80px;right:20px;width:360px;max-height:500px;background:var(--s1);border:1px solid var(--bd2);border-radius:12px;z-index:160;display:none;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.5);overflow:hidden}
.ai-panel.show{display:flex}
.ai-panel-h{padding:12px;border-bottom:1px solid var(--bd1);display:flex;align-items:center;gap:8px}
.ai-panel-h span{font-size:14px;font-weight:600;flex:1}
.ai-panel-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.ai-chat-msg{font-size:12px;padding:8px 10px;border-radius:8px;max-width:85%;line-height:1.4}
.ai-chat-msg.bot{background:var(--s3);align-self:flex-start}.ai-chat-msg.user{background:var(--acs);color:var(--ach);align-self:flex-end}
.ai-panel-foot{padding:8px;border-top:1px solid var(--bd1);display:flex;gap:6px}
.ai-panel-foot input{flex:1}

/* NOTES 4-PANEL */
.notes-body{display:grid;grid-template-columns:180px 220px 1fr 240px;min-height:0;height:100%}
.notes-nav,.notes-list,.notes-editor,.notes-rail{overflow-y:auto;padding:12px 8px}
.notes-nav{background:var(--s1);border-right:1px solid var(--bd1)}
.notes-list{border-right:1px solid var(--bd1)}
.notes-rail{background:var(--s1);border-left:1px solid var(--bd1)}
.nn{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;font-size:11px;color:var(--t2);cursor:pointer;margin-bottom:1px}
.nn:hover{background:var(--s3);color:var(--t1)}.nn.on{background:var(--acs);color:var(--ach)}
.nc{padding:6px;border-radius:6px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.nc:hover{background:var(--s3)}.nc.on{background:var(--acs);border-color:var(--ac)}
.nc-t{font-size:11px;font-weight:500;margin-bottom:2px}
.nc-tg{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:2px}
.nc-tg span{font-size:8px;color:var(--ac);background:var(--acs);padding:1px 4px;border-radius:2px}
.nc-m{font-size:9px;color:var(--t3);display:flex;gap:4px}

/* MCF GRID */
.mcf{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

/* TEAMS */
.team-card{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:14px;margin-bottom:10px}
.member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd1)}
.member-row:last-child{border-bottom:none}
.member-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.member-info{flex:1;min-width:0}.member-name{font-size:13px;font-weight:500}.member-role{font-size:10px;color:var(--t3)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:8px}
.perm-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);padding:4px 8px;background:var(--s3);border-radius:4px}

/* CRED CARD */
.cred{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:14px;margin-bottom:10px}
.cred-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cred-icon{width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cred-title{font-size:13px;font-weight:500}.cred-desc{font-size:10px;color:var(--t3)}
.cred-st{margin-left:auto;font-size:10px;display:flex;align-items:center;gap:3px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}.dot-g{background:var(--ok)}.dot-r{background:var(--red)}.dot-x{background:var(--t3)}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;z-index:300;animation:popIn .2s ease;pointer-events:none}

/* HABIT HEATMAP */
.hm{display:flex;gap:1px;flex-wrap:wrap}.hm-c{width:7px;height:7px;border-radius:1px;background:var(--s3)}.hm-c.ok{background:var(--ok)}.hm-c.mi{background:var(--s4)}

/* AI MATRIX */
.aim{width:100%;border-collapse:collapse;font-size:11px}
.aim th{text-align:left;padding:5px 6px;font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd2);font-weight:500}
.aim td{padding:6px;border-bottom:1px solid var(--bd1)}

/* IMPORT */
.import-zone{border:2px dashed var(--bd3);border-radius:10px;padding:30px;text-align:center;cursor:pointer;transition:all .2s}
.import-zone:hover{border-color:var(--ac);background:rgba(59,130,246,.05)}
.import-zone.dragover{border-color:var(--ac);background:rgba(59,130,246,.1)}

/* CALENDAR GRID */
.cal-grid{display:grid;grid-template-columns:50px repeat(7,1fr);gap:0}
.cal-hd{padding:6px;text-align:center;font-size:10px;font-weight:500;color:var(--t2);border-bottom:1px solid var(--bd2)}
.cal-tl{font-size:9px;color:var(--t3);text-align:right;padding:3px 6px 0 0}
.cal-c{border:1px solid var(--bd1);min-height:42px;padding:2px}
.cal-c:hover{background:rgba(255,255,255,.02)}
.cal-ev{font-size:9px;padding:2px 3px;border-radius:2px;margin-bottom:1px;border-left:2px solid var(--ac);background:var(--acs);cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-ev.grn{border-color:var(--ok);background:var(--oks)}.cal-ev.rd{border-color:var(--red);background:var(--reds)}.cal-ev.amb{border-color:var(--warn);background:var(--warns)}.cal-ev.prp{border-color:var(--purp);background:var(--purps)}

/* INSIGHT */
.ins{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:12px;margin-bottom:8px}
.ins.obs{border-left:3px solid var(--ac)}.ins.enc{border-left:3px solid var(--ok);background:rgba(34,197,94,.03)}.ins.wrn{border-left:3px solid var(--warn);background:rgba(245,158,11,.03)}
</style>
</head><body>
<div class="app">
<header class="topbar">
<div class="logo" onclick="nav('home')">
<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="12" r="3" fill="#3B82F6"/><circle cx="9" cy="18" r="2.5" fill="#3B82F6" opacity=".8"/><circle cx="23" cy="18" r="2.5" fill="#3B82F6" opacity=".8"/><circle cx="6" cy="10" r="2" fill="#3B82F6" opacity=".6"/><circle cx="26" cy="10" r="2" fill="#3B82F6" opacity=".6"/><circle cx="12" cy="25" r="2" fill="#3B82F6" opacity=".6"/><circle cx="20" cy="25" r="2" fill="#3B82F6" opacity=".6"/><line x1="16" y1="12" x2="9" y2="18" stroke="#3B82F6" stroke-width="1" opacity=".4"/><line x1="16" y1="12" x2="23" y2="18" stroke="#3B82F6" stroke-width="1" opacity=".4"/><line x1="9" y1="18" x2="12" y2="25" stroke="#3B82F6" stroke-width="1" opacity=".3"/><line x1="23" y1="18" x2="20" y2="25" stroke="#3B82F6" stroke-width="1" opacity=".3"/><line x1="12" y1="25" x2="20" y2="25" stroke="#3B82F6" stroke-width="1" opacity=".2"/></svg>
<div><b>LevelUp</b><small>The Second Brain</small></div>
</div>
<div class="tb-s"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input placeholder="Search everything..." id="gSearch"><span style="font-size:9px;color:var(--t3);background:var(--s3);padding:1px 4px;border-radius:3px">⌘K</span></div>
<div class="tb-a">

    <button class="btn btn-p" onclick="saveItem('task',${item.id})">Save Changes</button>
    <button class="btn btn-d" onclick="deleteItem('task',${item.id})">Delete</button>
    <button class="btn btn-s" onclick="closeDrawer()">Cancel</button></div>`;

    return `<h2>📝 Edit Note ${cb}</h2>
    <div class="field"><label>Title</label><input class="inp" value="${esc(item.title)}" id="dr-title"></div>

    return `<h2>📁 Edit Project ${cb}</h2>
    <div class="field"><label>Name</label><input class="inp" value="${esc(item.name)}" id="dr-title"></div>

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function saveItem(type,id){
  if(type==='task'){const t=D.tasks.find(x=>x.id===id);if(t){t.title=$('#dr-title').value;t.priority=$('#dr-pri').value;t.due=$('#dr-due').value;t.context=$('#dr-ctx').value;t.status=$('#dr-status').value;t.project=$('#dr-proj').value;t.notes=$('#dr-notes').value;save('tasks')}}
  if(type==='note'){const n=D.notes.find(x=>x.id===id);if(n){n.title=$('#dr-title').value;n.tags=$('#dr-tags').value.split(',').map(s=>s.trim()).filter(Boolean);n.source=$('#dr-source').value;n.body=$('#dr-body').value;n.updated='Just now';save('notes')}}
  if(type==='project'){const p=D.projects.find(x=>x.id===id);if(p){p.name=$('#dr-title').value;p.color=$('#dr-color').value;p.status=$('#dr-status').value;p.due=$('#dr-due').value;p.pct=parseInt($('#dr-pct').value)||0;p.desc=$('#dr-body').value;save('projects')}}
  if(type==='goal'){const g=D.goals.find(x=>x.id===id);if(g){g.title=$('#dr-title').value;g.icon=$('#dr-icon').value;g.pct=parseInt($('#dr-pct').value)||0;g.target=$('#dr-target').value;save('goals')}}
  if(type==='journal'){const j=D.journal.find(x=>x.id===id);if(j){j.title=$('#dr-title').value;j.date=$('#dr-date').value;j.mood=$('#dr-mood').value;j.body=$('#dr-body').value;save('journal')}}
  closeDrawer();toast('Saved!');renderScreen(curScreen);
}
function deleteItem(type,id){
  if(!confirm('Delete this item?'))return;
  if(type==='task')D.tasks=D.tasks.filter(x=>x.id!==id);
  if(type==='note')D.notes=D.notes.filter(x=>x.id!==id);
  if(type==='project')D.projects=D.projects.filter(x=>x.id!==id);
  if(type==='goal')D.goals=D.goals.filter(x=>x.id!==id);
  if(type==='journal')D.journal=D.journal.filter(x=>x.id!==id);
  save(type==='task'?'tasks':type+'s');
  closeDrawer();toast('Deleted');renderScreen(curScreen);
}

function doCapture(){

// ====== ONENOTE PDF IMPORT ======
function handleOneNoteFiles(files){
  const res=document.getElementById('onenote-results');
  res.innerHTML='<div style="font-size:12px;color:var(--ac)">Processing '+files.length+' file(s)...</div>';
  let imported=0;
  Array.from(files).forEach(file=>{
    if(!file.name.endsWith('.pdf')){res.innerHTML+='<div style="font-size:11px;color:var(--red)">⚠ Skipped (not PDF): '+esc(file.name)+'</div>';return}
    // Extract folder/tag from filename: "FolderName - NoteName.pdf" or "FolderName_NoteName.pdf"
    const nameNoExt=file.name.replace('.pdf','');
    let tag='imported',title=nameNoExt;
    if(nameNoExt.includes(' - ')){const parts=nameNoExt.split(' - ');tag=parts[0].trim();title=parts.slice(1).join(' - ').trim()}
    else if(nameNoExt.includes('_')){const parts=nameNoExt.split('_');tag=parts[0].trim();title=parts.slice(1).join('_').trim()}
    // Read PDF as text (basic extraction)
    const reader=new FileReader();
    reader.onload=function(e){
      let bodyText='[PDF content from: '+file.name+']\n\nThis note was imported from a OneNote PDF export.\nOriginal file size: '+(file.size/1024).toFixed(1)+' KB\n\nTo view the full content, open the original PDF file.';
      // Try to extract text if possible (basic approach)
      try{
        const bytes=new Uint8Array(e.target.result);
        const text=new TextDecoder('utf-8',{fatal:false}).decode(bytes);
        const textMatches=text.match(/\(([^)]{3,200})\)/g);
        if(textMatches&&textMatches.length>5){
          const extracted=textMatches.map(m=>m.slice(1,-1)).filter(s=>s.length>3&&!s.includes('\\')).join(' ').substring(0,2000);
          if(extracted.length>50)bodyText=extracted+'\n\n[Extracted from PDF - may contain formatting artifacts]';
        }
      }catch(ex){}
      D.notes.push({id:nextId(D.notes),title:title||nameNoExt,tags:[tag.toLowerCase(),'onenote'],source:'OneNote Import',updated:'Just now',starred:false,body:bodyText});
      save('notes');imported++;
      res.innerHTML=`<div style="font-size:12px;color:var(--ok)">✓ Imported ${imported} note(s)</div>`;
      res.innerHTML+=`<div class="lr" onclick="openDrawer('note',D.notes[D.notes.length-1])"><span style="font-size:9px;padding:2px 4px;border-radius:2px;background:var(--purps);color:var(--purp)">OneNote</span><span class="rt">${esc(title)}</span><span style="font-size:9px;padding:2px 4px;border-radius:2px;background:var(--s3);color:var(--t3)">#${tag.toLowerCase()}</span></div>`;
    };
    reader.readAsArrayBuffer(file);
  });
}

let aiMsgIdx=0,aiTimer=null;

function startAIAssistant(){
  if(aiTimer)return;
  showAIMsg();
  aiTimer=setInterval(showAIMsg,45000); // every 45 seconds
}
function showAIMsg(){
  const bubble=document.getElementById('ai-bubble');
  const m=aiMsgs[aiMsgIdx%aiMsgs.length];aiMsgIdx++;
  const div=document.createElement('div');
  div.className='ai-msg';
  div.innerHTML=`<button class="ai-close" onclick="this.parentElement.remove()">✕</button><div class="ai-type ${m.type}">${m.type.toUpperCase()}</div><div>${m.msg}</div>`;
  bubble.insertBefore(div,bubble.firstChild);
  // Speak if enabled
  if('speechSynthesis' in window && D.creds.aiSpeak){
    const u=new SpeechSynthesisUtterance(m.msg.replace(/[📅⚠️🌟💡📰🌤️🔥📊🌍]/g,''));
    u.rate=1;u.pitch=1;u.volume=0.7;speechSynthesis.speak(u);
  }
  // Remove after 15 seconds
  setTimeout(()=>{if(div.parentElement)div.remove()},15000);
  // Keep max 3 visible
  while(bubble.children.length>3)bubble.lastChild.remove();
}

function toggleAIPanel(){
  const p=document.getElementById('ai-panel');
  p.classList.toggle('show');
  if(p.classList.contains('show')&&!document.getElementById('ai-chat').children.length){
    appendAIChat('bot','👋 Hi! I\'m your LevelUp assistant. I can help with tasks, goals, meeting prep, and more. I also share updates on your subscribed topics (Technology, World News, etc). What would you like help with?');

}
function appendAIChat(role,msg){
  const c=document.getElementById('ai-chat');
  const d=document.createElement('div');d.className='ai-chat-msg '+role;d.textContent=msg;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function sendAIMsg(){
  const inp=document.getElementById('ai-input');const msg=inp.value.trim();if(!msg)return;
  appendAIChat('user',msg);inp.value='';
  // Simulated AI responses
  setTimeout(()=>{
    let resp='I\'ll look into that for you! ';
    if(msg.toLowerCase().includes('task'))resp='You have '+D.tasks.filter(t=>t.status!=='Done').length+' active tasks. '+D.tasks.filter(t=>t.due==='Today').length+' are due today. Would you like me to help prioritize?';
    else if(msg.toLowerCase().includes('meeting'))resp='Your next meeting is Budget Review at 10:30 AM. I\'ve prepared the attendee list and linked SharePoint docs.';
    else if(msg.toLowerCase().includes('goal'))resp='Your top goal "Launch 2 products" is at 50%. The Product Launch Q2 project (40%) is the main driver. Consider scheduling focus blocks this week.';
    else if(msg.toLowerCase().includes('weather'))resp='🌤️ Currently 72°F in your area. Afternoon showers expected around 3 PM. Plan outdoor activities for the morning.';
    else if(msg.toLowerCase().includes('news'))resp='📰 Top tech news: AI regulation discussions continue in Congress. New chip export controls announced. React 20 released with server components improvements.';
    else if(msg.toLowerCase().includes('habit'))resp='🔥 You\'re doing great! Morning meditation is at 22 days. Reading is at 15 days. Try to complete your journal entry tonight to keep that 12-day streak going.';
    else resp+='I can help with tasks, goals, meetings, weather, news, and productivity tips. Just ask!';
    appendAIChat('bot',resp);
    if('speechSynthesis' in window && D.creds.aiSpeak){
      const u=new SpeechSynthesisUtterance(resp.replace(/[📅⚠️🌟💡📰🌤️🔥📊🌍]/g,''));u.rate=1;u.volume=0.7;speechSynthesis.speak(u);

}
