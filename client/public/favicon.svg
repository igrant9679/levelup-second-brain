<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LevelUp "Aurora Stack" mark — three knowledge layers, top one lifting off.
       Icon variant: keeps the dark rounded-square container of the previous
       favicon so it reads on any tab colour, and drops to TWO layers with a
       heavier stroke, because the third layer turns to mud below ~24px. -->
  <defs>
    <linearGradient id="lu-grad" x1="16" y1="34" x2="48" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" ry="12" fill="#0B0F1A"/>
  <path d="m32 13 21 11.5L32 36 11 24.5Z" fill="url(#lu-grad)"/>
  <path d="m11 38 21 11.5L53 38" fill="none" stroke="#818CF8" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
</svg>
