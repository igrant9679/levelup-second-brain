<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E2740"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- L letter -->
  <text x="8" y="48" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="white" filter="url(#glow)">L</text>
  <!-- U with upward arrow integrated -->
  <text x="30" y="48" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="white" filter="url(#glow)">U</text>
  <!-- Upward arrow on top of U's right stem -->
  <polygon points="50,8 54,16 52,16 52,22 48,22 48,16 46,16" fill="#3B82F6" filter="url(#glow)"/>
</svg>
